# Extra sources of the uke build tree; the base feeds.toml supplies the rest.
[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "main"
commit = "7edb88fbae296fb7c8ce2f64e115e116e566d51c"
# Synced with the reference board, and it has to be: the storage adapter in the core
# (scripts/build-sheng-source-storage.py:109) calls prepare(storage, "7edb88fb...", out) with that revision
# written into the call, and scripts/prepare-storage-headers.py is now the core's own implementation, which
# takes the revision as an argument instead of pinning one. b274 failed because the device copy pinned
# e45fbe30 and rejected 7edb88fb; b275 failed because the device copy had no prepare() at all
# (AttributeError: module 'source_headers' has no attribute 'prepare').

