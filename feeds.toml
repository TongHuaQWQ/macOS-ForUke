# USB device mode, the way the same-device upstream runs it: the Qualcomm subclass of the original
# AppleUSBXDCI in this fileset. Allenwdk/UniXNU-uke pins the same commit and drives it with the board
# initialisation in package/UkeUsbBoard.cpp (rails/RSC 3.2, core GDSC, TCSR USB2 clkref, XDCI reset slot,
# PMIC repeater, WCD939x routing). Its 2026-11-15 record (docs/USB2-20261115.md) is the first time this
# board enumerated in device mode at all: host saw 05ac:12ab, speed 480, bConfigurationValue 1.
[[source]]
name = "QcomDwc3"
kind = "driver"
git = "https://github.com/Allenwdk/QcomDwc3.git"
commit = "4825d1f98b98abdea12bdd26b0b632467a3a67dd"

[[source]]
name = "ShengUfs"
kind = "driver"
# The *source-API* UFS driver, which is a different driver from drivers/NativeUfs: the official
# same-device repository ships both, and build-sheng-source-storage.py compiles this one
# (device/drivers/ShengUfs/NativeUfs.cpp) with -DNATIVE_UFS_SOURCE_API=1. drivers/NativeUfs is the
# classic bring-up driver (native-ufs-allow-unverified) and stays in the tree for the freestanding log
# transport's headers; pointing this entry at it made the adapter compile the classic driver under the
# source-API flags, which is also why the two verified-block helpers it defines collided with the
# SourceRootBinding.cpp the runtime brings.
local = "drivers/ShengUfs"

[[source]]
name = "ShengNovatekTouch"
kind = "driver"
local = "drivers/NativeNovatekTouch"

# The official USB controller, as this board's copy. The catalog entry (UniXNU/QcomDwc3, "Qualcomm DWC3 USB
# device and host controller for Apple's native stacks") is verified on sheng, an SM8550 board; this copy is
# the same driver with the board's own constants -- the DWC3 wrapper, TCSR, RPMh-RSC and the USB SPI are
# cliffs addresses (work/analysis/NOW.md records each one against live.dts), not sheng's.
#
# `local` and not a `git` pin, for the first-wins reason ArmCpu above explains; this one is not a submodule
# of the core, but the same override has to hold when the catalog starts pinning a revision we do not match.
# scripts/build-qcom-dwc3.py compiles it; the tree only needs the sources materialised at drivers/QcomDwc3.
[[source]]
name = "QcomDwc3"
kind = "driver"
local = "drivers/QcomDwc3"

# Qualcomm Bluetooth over GENI UART (upstream UniXNU/QcaBluetooth@fa52814 extended with WCN6750
# SoC support via qbt_boot_soc(), standalone fork at work/push/QcaBluetooth@7db9642).
# Kept as a local feed override (same first-wins reason as QcomDwc3 and ArmCpu) so both
# TongHuaQWQ/UniXNU@macos and local checkouts build our WCN6750-enabled copy via
# scripts/build-qca-bluetooth.py.
[[source]]
name = "QcaBluetooth"
kind = "driver"
local = "drivers/QcaBluetooth"

# The instrumented ArmCpu. prepareGic() fails silently by design, so on a board where the timer never ticks
# there is no way to tell "the driver never matched" from "mapGic/initDistributor/wakeRedistributor returned
# false". This copy reports each step and prints IGROUPR0/ISENABLER0 for PPI 27 once the GIC is up.
#
# A board copy rather than a git pin: feeds.py resolves sources first-wins and the core's drivers/ArmCpu
# submodule is already registered by the time git entries are looked at (step 7), so a `git` entry for a
# component the core carries as a submodule silently never takes effect -- two rounds built the submodule's
# ArmCpu and shipped a kernel with no probes. A `local` entry resolves in step 4 and does win.
# The same content is published as TongHuaQWQ/ArmCpu@6288238.
# Board copy of the platform expert, for the same first-wins reason as ArmCpu. The only
# difference from the core's copy is the IOPlatformIO provider (see the driver).
[[source]]
name = "ArmDTPlatform"
kind = "driver"
local = "drivers/ArmDTPlatform"

[[source]]
name = "ArmCpu"
kind = "driver"
# Synced 2026-11-18 with the branch this board actually runs iPadOS with: the GICR SGI-frame reads that
# caused the "platform error" storm of b170..b261 are not in it, and it still carries cluster, cpufreq,
# idle and edge support (docs/UPSTREAM-REVIEW-20261118.md §1 and §2).
#
# `local` wins over `git`, and that is the point: feeds.py resolves the core's own submodules first, so a
# `git` pin here never takes effect for a component the core carries. Two earlier rounds silently built
# UniXNU/ArmCpu@93a5030 while this entry claimed the commit below. b278 is the round that showed what
# that costs: the source UFS runtime calls armcpu_spi_mask() from NativeUfs.cpp's hostEnableInterrupt(),
# 93a5030 does not define it, and the kernel link stopped on "_armcpu_spi_mask". drivers/ArmCpu is this
# commit, verbatim — no local edits.
local = "drivers/ArmCpu"
git = "https://github.com/Allenwdk/ArmCpu.git"
commit = "87212886526392ed4b25ea1ce7345a6fe82508d8"

