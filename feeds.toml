# The instrumented ArmCpu. prepareGic() fails silently by design, so on a board where the timer never ticks
# there is no way to tell "the driver never matched" from "mapGic/initDistributor/wakeRedistributor returned
# false". This copy reports each step and prints IGROUPR0/ISENABLER0 for PPI 27 once the GIC is up.
#
# A board copy rather than a git pin: feeds.py resolves sources first-wins and the core's drivers/ArmCpu
# submodule is already registered by the time git entries are looked at (step 7), so a `git` entry for a
# component the core carries as a submodule silently never takes effect -- two rounds built the submodule's
# ArmCpu and shipped a kernel with no probes. A `local` entry resolves in step 4 and does win.
# The same content is published as TongHuaQWQ/ArmCpu@6288238.
# Board copy of the platform expert, for the same first-wins reason as ArmCpu. The only
# difference from the core's copy is the IOPlatformIO provider (see the driver).
[[source]]
name = "ArmDTPlatform"
kind = "driver"
local = "drivers/ArmDTPlatform"

[[source]]
name = "QcomXnuUsbDebug"
kind = "driver"
local = "drivers/QcomXnuUsbDebug"

[[source]]
name = "ArmCpu"
kind = "driver"
local = "drivers/ArmCpu"
git = "https://github.com/TongHuaQWQ/ArmCpu.git"
commit = "6288238"


# The prelink kit as a board copy, for the same reason as the drivers above: feeds resolve
# first-wins and a git pin cannot override the core's kits/XnuPrelink submodule. The copy carries the
# reviewed anchors this board needs in fixtures/fileset-25F84-symbols.json; without a writable copy the
# anchors have nowhere to live, because the matcher reads them from Path(__file__).parent/'fixtures'.
[[source]]
name = "XnuPrelink"
kind = "kit"
local = "kits/XnuPrelink"

# The legacy alias is NOT registered here on purpose: a second kit entry made the tree stop creating
# kits/NativePrelink, and the prelink tool path resolved to a file that did not exist. board.toml now
# names the canonical path instead.
