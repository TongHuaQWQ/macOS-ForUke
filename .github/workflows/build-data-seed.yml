name: build-uke-data-seed

# Build the macOS 27.3 (26C5035r) APFS Data seed for Xiaomi Pad 7 (uke) sized to
# 192 GiB so it fits cleanly inside uke's 225.02 GiB userdata partition alongside
# the ~16.4 GiB macOS root image and 1 GiB log reserve (192 + 16.4 + 1 = 209.4 GiB
# < 225.02 GiB; the upstream sheng 210 GiB seed overlapped uke's root image).
# Uses CONFIG_XNU_OWNER_DATA_VOLUME_UUID so the resulting data.dbr drops straight
# into existing kernels without a kernel rebuild.

on:
  workflow_dispatch:
    inputs:
      data_gib:
        description: "Logical APFS container size in GiB (must fit uke 225 GiB userdata)"
        required: false
        default: "192"
      volume_uuid:
        description: "CONFIG_XNU_OWNER_DATA_VOLUME_UUID"
        required: false
        default: "BB2462E2-040E-4F82-9C69-CACB7A872551"

permissions:
  contents: read

jobs:
  data-seed:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU (macos)
        uses: actions/checkout@v4
        with:
          repository: TongHuaQWQ/UniXNU
          ref: macos
          path: UniXNU
          submodules: recursive

      - name: Host tools
        run: brew install openssl@3 ipsw

      - name: Fetch the macOS 27.3 OS member
        working-directory: UniXNU
        run: ./unixnu ipsw fetch OS -D ../UniXNU-uke | tee /tmp/os-member.txt

      - name: Build the 192 GiB macOS Data seed
        working-directory: UniXNU
        run: |
          set -euo pipefail
          OS=$(tail -1 /tmp/os-member.txt)
          case "$OS" in
            *.aea)
              PLAIN=$(PYTHONPATH=scripts python3 -c 'import pathlib,sys; from unixnu.ipsw import decrypt_aea; print(decrypt_aea(pathlib.Path(sys.argv[1])))' "$OS" | tail -1)
              rm -f "$OS"
              OS="$PLAIN"
              ;;
          esac
          test -f "$OS"
          echo "OS image: $OS"
          mkdir -p build/macos-data-seed
          sudo python3 scripts/make-macos-data-seed.py "$OS" build/macos-data-seed/data.dbr \
            --gib "${{ inputs.data_gib || '192' }}" \
            --volume-uuid "${{ inputs.volume_uuid || 'BB2462E2-040E-4F82-9C69-CACB7A872551' }}"
          ls -lh build/macos-data-seed/data.dbr
          shasum -a 256 build/macos-data-seed/data.dbr | tee build/macos-data-seed/data.dbr.sha256

      - name: Upload the macOS Data seed
        uses: actions/upload-artifact@v4
        with:
          name: uke-macos-data-seed-192g
          path: |
            UniXNU/build/macos-data-seed/data.dbr
            UniXNU/build/macos-data-seed/data.dbr.sha256
          if-no-files-found: error
          retention-days: 14
