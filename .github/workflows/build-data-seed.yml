name: build-uke-data-seed

# Build the macOS 27.3 (26C5035r) APFS Data seed for Xiaomi Pad 7 (uke) sized to
# 192 GiB so it fits cleanly inside uke's 225.02 GiB userdata partition alongside
# the ~16.4 GiB macOS root image and 1 GiB log reserve (192 + 16.4 + 1 = 209.4 GiB
# < 225.02 GiB; the upstream sheng 210 GiB seed overlapped uke's root image).
# Uses CONFIG_XNU_OWNER_DATA_VOLUME_UUID so the resulting data.dbr drops straight
# into existing kernels without a kernel rebuild.

on:
  workflow_dispatch:
    inputs:
      data_gib:
        description: "Logical APFS container size in GiB (must fit uke 225 GiB userdata)"
        required: false
        default: "192"
      volume_uuid:
        description: "CONFIG_XNU_OWNER_DATA_VOLUME_UUID"
        required: false
        default: "BB2462E2-040E-4F82-9C69-CACB7A872551"

permissions:
  contents: read

jobs:
  data-seed:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU (macos)
        uses: actions/checkout@v4
        with:
          repository: TongHuaQWQ/UniXNU
          ref: macos
          path: UniXNU
          submodules: recursive

      - name: Check out the SM7675 SoC layer (feeds.toml sibling source)
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/sm7675.txt
          import tomllib
          d = tomllib.load(open('UniXNU-uke/feeds.toml', 'rb'))
          s = next(x for x in d['source'] if x['name'] == 'sm7675')
          print(s['git'])
          print(s['commit'])
          PY
          url=$(sed -n 1p /tmp/sm7675.txt)
          sha=$(sed -n 2p /tmp/sm7675.txt)
          git init -q UniXNU-sm7675-common
          git -C UniXNU-sm7675-common remote add origin "$url"
          git -C UniXNU-sm7675-common fetch -q --depth 1 origin "$sha" || git -C UniXNU-sm7675-common fetch -q origin
          git -C UniXNU-sm7675-common checkout -q "$sha"

      - name: Host tools
        run: brew install openssl@3 ipsw

      - name: Fetch the macOS 27.3 OS member
        working-directory: UniXNU
        run: |
          set -euo pipefail
          ./unixnu ipsw fetch OS -D ../UniXNU-uke | tee /tmp/os-member.txt

      - name: Build the 192 GiB macOS Data seed
        working-directory: UniXNU
        run: |
          set -euo pipefail
          OS=$(tail -1 /tmp/os-member.txt)
          case "$OS" in
            *.aea)
              PLAIN=$(PYTHONPATH=scripts python3 -c 'import pathlib,sys; from unixnu.ipsw import decrypt_aea; print(decrypt_aea(pathlib.Path(sys.argv[1])))' "$OS" | tail -1)
              rm -f "$OS"
              OS="$PLAIN"
              ;;
          esac
          test -f "$OS"
          echo "OS image: $OS"
          # macOS 26 runners can take a few seconds after `hdiutil attach -nomount` for diskarbitrationd
          # to synthesize the APFS container; retry up to 15s and also match slice identifiers (diskXs1).
          python3 - <<'PY'
          p = 'scripts/seed-data-grow.py'
          s = open(p).read()
          old = """            listing = plistlib.loads(subprocess.check_output(['diskutil', 'apfs', 'list', '-plist']))
            container = None
            for entry in listing['Containers']:
                if any(s['DeviceIdentifier'] == store for s in entry.get('PhysicalStores', [])):
                    container = entry['ContainerReference']"""
          new = """            import time
            container = None
            for _ in range(30):
                listing = plistlib.loads(subprocess.check_output(['diskutil', 'apfs', 'list', '-plist']))
                for entry in listing.get('Containers', []):
                    if any(s['DeviceIdentifier'] == store or s['DeviceIdentifier'].startswith(store + 's') for s in entry.get('PhysicalStores', [])):
                        container = entry['ContainerReference']
                        break
                if container:
                    break
                time.sleep(0.5)"""
          assert old in s, 'seed-data-grow.py mismatch'
          open(p, 'w').write(s.replace(old, new, 1))
          PY
          mkdir -p build/macos-data-seed
          sudo python3 scripts/make-macos-data-seed.py "$OS" build/macos-data-seed/data.dbr \
            --gib "${{ inputs.data_gib || '192' }}" \
            --volume-uuid "${{ inputs.volume_uuid || 'BB2462E2-040E-4F82-9C69-CACB7A872551' }}"
          ls -lh build/macos-data-seed/data.dbr
          shasum -a 256 build/macos-data-seed/data.dbr | tee build/macos-data-seed/data.dbr.sha256

      - name: Upload the macOS Data seed
        uses: actions/upload-artifact@v4
        with:
          name: uke-macos-data-seed-192g
          path: |
            UniXNU/build/macos-data-seed/data.dbr
            UniXNU/build/macos-data-seed/data.dbr.sha256
          if-no-files-found: error
          retention-days: 14
