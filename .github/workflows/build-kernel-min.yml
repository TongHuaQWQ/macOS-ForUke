# Minimal, self-diagnosing replacement for build-kernel.yml — format-2 aware.
#
# Why this exists (three defects in the upstream workflow, all invisible behind a warm CI cache):
#
#   1. feeds.toml pins the SM7675 SoC layer as a sibling checkout (../UniXNU-sm7675-common) and the
#      workflow never clones it, so every ./unixnu command died with
#      "soc sm7675: ... is not a directory" on a clean runner.
#   2. zzzzzzzzzzz-uke-panic-flush.patch called uke_panic_flush unconditionally. That symbol lives in
#      libUkeLastLog.a, built from the bootstrap pass's own compile records — so it cannot exist while
#      bootstrap links. Fixed in the device repository by guarding the call on XNU_WATCHDOG_POLICY,
#      which scripts/build-xnu-4k-baseline.sh always defines.
#   3. every path was format 1 (out/uke/kernel/...). This device repository is format 2, so outputs
#      land in out/uke/<os_profile>/<config>/ — which broke `test -f` immediately after a successful
#      bootstrap. This file resolves the output directory with `unixnu status --json` instead of
#      hardcoding it, and adds the missing `unixnu tree` pass plus the prelink-candidate staging.
#
# Install: .github/workflows/build-kernel-min.yml in your fork. Run: Actions -> Run workflow.

name: build-uke-kernel-min

on:
  # A push to a ci-* branch runs this workflow with the same defaults as the form below, so an agent or
  # a script can start a round by pushing a branch instead of needing a token. Nothing else is affected:
  # main and the round-* experiment branches stay manual.
  push:
    branches:
      - 'ci-*'
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Device defconfig to build (uke-nodisplay skips the audit-gated display archive)'
        required: true
        default: 'uke_defconfig'
        type: choice
        options:
          - uke_defconfig
          - uke-nodisplay_defconfig
          - uke-storage_defconfig
          - uke-macos_defconfig
          - uke-userland_defconfig
          - uke-full_defconfig
      core_repository:
        description: 'Core UniXNU repository (owner/name)'
        required: true
        default: 'Allenwdk/UniXNU'
      core_ref:
        description: 'Core UniXNU ref (branch or commit)'
        required: true
        default: 'uke-gpu'
      skip_prelink:
        description: 'Copy the native kernel without the kernelcache kexts (boot test only)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  # One source of truth for the run's parameters. workflow_dispatch supplies them; a push to a ci-*
  # branch has no inputs, so these fall back to the round's defaults. Steps read env.*, never inputs.*.
  UKE_DEFCONFIG: ${{ inputs.defconfig || 'uke-macos_defconfig' }}
  UKE_CORE_REPO: ${{ inputs.core_repository || 'TongHuaQWQ/UniXNU' }}
  UKE_CORE_REF: ${{ inputs.core_ref || 'macos' }}
  UKE_SKIP_PRELINK: ${{ inputs.skip_prelink || 'false' }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # Do NOT export UNIXNU_OUT / UNIXNU_DEVICE here: scripts/unixnu/config.py reads them as the output
  # root and the device directory, so reusing either name makes every later command look for
  # state.json in the wrong place ("unixnu: no configuration"). This workflow uses UKE_*_DIR instead.

jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Diagnose environment
        run: |
          set -x
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          brew --version
          df -h /
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF defconfig=${{ env.UKE_DEFCONFIG }} core=${{ env.UKE_CORE_REPO }}@${{ env.UKE_CORE_REF }}"

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UKE_CORE_REPO }}
          ref: ${{ env.UKE_CORE_REF }}
          path: UniXNU

      # Cheap guard against an expensive failure: patches/xnu/series applies the *copies* in patches/xnu/,
      # while the component owns the originals under package/qcom-usb-debug/patches/. A fix written in one
      # place only is invisible until the kernel compile dies on it, eight minutes into the link step
      # (STATE 73). This runs before any build work, so drift costs seconds instead of a round.
      - name: Check the component patch copies against the component
        working-directory: UniXNU-uke
        run: python3 scripts/check-patch-copies.py

      # The kernel archives only compile here, which made every component typo a 25-minute round. This
      # step runs the checks that need nothing but a host compiler, in under a minute. It reports and
      # never blocks: the component is a kit checkout, so a broken check must not stop a kernel build
      # that the next hardware round needs.
      - name: Component self-checks (host compiler only; never blocks the build)
        continue-on-error: true
        working-directory: UniXNU-uke
        run: |
          KITS=kits/uke/qcom-usb-debug
          [ -d "$KITS" ] || KITS=package/qcom-usb-debug
          bash "$KITS/scripts/check-component.sh" || true

      - name: Record revisions
        run: |
          set -x
          git -C UniXNU-uke rev-parse HEAD
          git -C UniXNU rev-parse HEAD
          # The XnuPrelink submodule is initialised later, by the tree step, so this must not fail here.
          git -C UniXNU/kits/XnuPrelink rev-parse HEAD 2>/dev/null || echo 'kits/XnuPrelink not initialised yet'

      - name: Install the host tools (with retry)
        run: |
          set -x
          for attempt in 1 2 3; do
            if brew install cmake ninja unifdef llvm mtools dtc; then break; fi
            echo "::warning::brew install attempt $attempt failed; refreshing and retrying"
            brew update --quiet || true
            sleep $((attempt * 10))
          done
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the tools unixnu checks for
        run: |
          set -x
          rc=0
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            path="$(command -v "$tool" || echo MISSING)"
            printf '%-10s %s\n' "$tool" "$path"
            [ "$path" = "MISSING" ] && rc=1
          done
          exit $rc

      # feeds.toml pins the SoC layer as a sibling checkout; nothing else creates it.
      - name: Check out the SM7675 SoC layer (feeds.toml sibling source)
        run: |
          set -x
          python3 - <<'PY' > /tmp/sm7675.txt
          import tomllib
          d = tomllib.load(open('UniXNU-uke/feeds.toml', 'rb'))
          s = next(x for x in d['source'] if x['name'] == 'sm7675')
          print(s['git'])
          print(s['commit'])
          PY
          url=$(sed -n 1p /tmp/sm7675.txt)
          sha=$(sed -n 2p /tmp/sm7675.txt)
          echo "url=$url sha=$sha"
          git init -q UniXNU-sm7675-common
          git -C UniXNU-sm7675-common remote add origin "$url"
          git -C UniXNU-sm7675-common fetch -q --depth 1 origin "$sha" || git -C UniXNU-sm7675-common fetch -q origin
          git -C UniXNU-sm7675-common checkout -q "$sha"
          git -C UniXNU-sm7675-common log -1 --format='%h %s'

      # Build-environment shim, not a source change. The archive recipes hardcode clang warning names
      # and compile with -Werror, so a name the runner's clang no longer knows is fatal:
      #   error: unknown warning option '-Wno-unused-but-set-global'; did you mean
      #          '-Wno-unused-but-set-variable'? [-Werror,-Wunknown-warning-option]
      # The runner now ships Xcode 26.6 with Homebrew clang 23.1.4, newer than the toolchain these
      # recipes were written against. '-Wno-unknown-warning-option' makes the compiler ignore any
      # warning name it does not recognise, which is exactly the drift to absorb. Idempotent, and the
      # log prints the patched line so a reviewer can see it.
      # Upstream fix: put the flag in the core's recipe lists so no workflow needs this step.
      - name: Tolerate newer clang warning names in the archive recipes
        run: |
          set -x
          python3 - <<'PY'
          import pathlib
          targets = ['UniXNU/scripts/build-arm-driver.py',
                     'UniXNU-uke/scripts/build-native-legacy-display.py']
          for name in targets:
              p = pathlib.Path(name)
              if not p.is_file():
                  print('skipped (absent):', name)
                  continue
              s = p.read_text()
              if '-Wno-unknown-warning-option' in s:
                  print('already patched:', name)
                  continue
              anchor = "'-Wno-unused-parameter'"
              if anchor not in s:
                  print('anchor not found, left alone:', name)
                  continue
              p.write_text(s.replace(anchor, anchor + ", '-Wno-unknown-warning-option'", 1))
              print('patched:', name)
          PY
          grep -n "unknown-warning-option" UniXNU/scripts/build-arm-driver.py UniXNU-uke/scripts/build-native-legacy-display.py || true

      - name: Fetch the Apple references
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D ../UniXNU-uke

      - name: Fetch the target IPSW members
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu ipsw fetch -D ../UniXNU-uke
          ls -lR out/ipsw | head -40

      # Pass 1 produces two things nothing else can: the compile records of a full XNU compile, and
      # the prelinked candidate the original-class audits compare against. It runs in its own config
      # directory (format 2: one tree per config), and the candidate is then staged into the target
      # tree by the next step.
      - name: Pass 1 — bootstrap records and the prelink candidate
        working-directory: UniXNU
        # A port under construction has more than one unknown at a time and make stops at the first,
        # so every run costs a round trip per error. -k carries on and one run reports them all; a run
        # that fails produces no kernel anyway. Recursive make inherits it through MAKEFLAGS.
        env:
          MAKEFLAGS: -k
        run: |
          set -x
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-uke
          # Pass 1 exists for the compile records and a candidate kernel, not for a final image, so it
          # never prelinks. It also cannot: the macOS 26 kernelcache is an MH_FILESET and
          # emit_prelink.py needs a symbol-bearing comparison kernel, which is built from the target
          # tree once its archives exist. bootstrap_defconfig enables no archives.
          ./unixnu build kernel --skip-prelink -D ../UniXNU-uke
          BS=$(./unixnu status --json -D ../UniXNU-uke | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])')
          echo "UKE_BS_DIR=$BS" >> "$GITHUB_ENV"
          echo "bootstrap output dir: $BS"
          ls -l "$BS/kernel"
          test -f "$BS/kernel/kernel.macho"
          test -f "$BS/kernel/kernel.json"

      - name: Assemble the target tree and stage the prelink candidate
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu defconfig ${{ env.UKE_DEFCONFIG }} -D ../UniXNU-uke
          ./unixnu tree -D ../UniXNU-uke
          OUT=$(./unixnu status --json -D ../UniXNU-uke | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])')
          echo "UKE_OUT_DIR=$OUT" >> "$GITHUB_ENV"
          echo "target output dir: $OUT"
          if [ "${{ env.UKE_SKIP_PRELINK }}" = "true" ]; then
            # A prelink-less kernel carries no corecrypto kext at all, so it has to bring its own
            # provider: source mode compiles one (and, when a collection does carry the original, that
            # provider is what finds it and shares the result through the OSKext hook).
            #
            # A prelinking configuration keeps the pinned "prelinked" instead. It has to:
            # build-xnu-4k-baseline.sh refuses XNU_NATIVE_AES=1 in any other mode, because the software
            # AES adapter needs the qualified original AES/crypto prelink closure — and uke-storage,
            # the configuration that can prelink, sets NATIVE_AES.
            sed -i '' 's/^CONFIG_XNU_CRYPTO_BOOTSTRAP="prelinked"/CONFIG_XNU_CRYPTO_BOOTSTRAP="source"/' "$OUT/.config"
          fi
          grep -n 'CRYPTO_BOOTSTRAP\|SOURCE_CORECRYPTO' "$OUT/.config" || true
          # Two directories are in use and they are not synonyms:
          #   build/xnu-prelink/     the audit-*.py family, including audit-mobile-graphics-legacy.py
          #                          which build-native-legacy-display.py runs as its first step;
          #   build/native-prelink/  build-native-aes-bindings.py, build-native-hid-input.py,
          #                          build-native-virtio-bindings.py.
          # Upstream's workflow staged only the second, so the graphics audit reported
          # "No reference candidate available". Stage both.
          for dir in "$OUT/tree/build/xnu-prelink" "$OUT/tree/build/native-prelink"; do
            mkdir -p "$dir"
            for name in native-owner-mobile-graphics-candidate native-owner-ufs-cpu-desktop-v9-hid-init-candidate; do
              cp "$UKE_BS_DIR/kernel/kernel.macho" "$dir/$name.macho"
              cp "$UKE_BS_DIR/kernel/kernel.json"  "$dir/$name.json"
            done
            echo "--- $dir"
            ls -l "$dir"
          done

          # scripts/xnu_symbols.py prefers this checkpoint over nm-ing the target tree's objects
          # ("Names of the XNU kernel alone"). Pass 1's kernel is exactly that: a linked 4 KiB XNU with
          # none of this tree's archives in it. Under format 2 the archive builders run before the target
          # tree has ever linked, and build-xnu-4k-baseline.sh deletes startup.o whenever a per-object
          # compile flag changes, so the object set there is not a reliable symbol source.
          mkdir -p "$OUT/tree/build/xnu/checkpoints/native-4k-user-abi"
          cp "$UKE_BS_DIR/kernel/kernel.macho" "$OUT/tree/build/xnu/checkpoints/native-4k-user-abi/kernel.macho"
          ls -l "$OUT/tree/build/xnu/checkpoints/native-4k-user-abi/"

      # A configuration without CONFIG_XNU_BUILD_ARCHIVES (uke_defconfig) links without the archives the
      # driver would otherwise build, so this pass stops at the link — on purpose. What it leaves behind
      # is what the archive builders need: build/xnu/ios-obj/... (EXPORT_HDRS and the compile records).
      # The separate bootstrap config's tree cannot provide them: format 2 gives every config its own tree.
      - name: Pass 2 — compile records inside the target tree (link expected to fail)
        if: contains(fromJSON('["uke_defconfig","uke-nodisplay_defconfig"]'), env.UKE_DEFCONFIG)
        working-directory: UniXNU
        run: |
          set -x
          if ./unixnu build kernel -D ../UniXNU-uke; then
            echo "::notice::the unixnu driver linked without the archives; continuing"
          else
            echo "::warning::this pass stopped at the link, which is expected for a config without CONFIG_XNU_BUILD_ARCHIVES"
          fi
          test -f "$UKE_OUT_DIR/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/startup.o.json"
          test -d "$UKE_OUT_DIR/tree/build/xnu/ios-obj/EXPORT_HDRS"

      # The first-console configuration does not opt in to the board archive list, so its archives are
      # built here explicitly, in the same tree as the records from pass 2.
      - name: Build the first-console archives
        if: contains(fromJSON('["uke_defconfig","uke-nodisplay_defconfig"]'), env.UKE_DEFCONFIG)
        working-directory: UniXNU
        run: |
          set -x
          workspace="$UKE_OUT_DIR/tree"
          # scripts/kernel_target.py checks every archive object's architecture and LC_BUILD_VERSION
          # against the kernel target, and reads both from the environment. The driver exports them for
          # its own kernel build; this step runs the archive scripts itself, so it has to set them or
          # kernel_target falls back to arm64 and rejects the arm64e objects the arch profile asks for
          # ("ArmDTPlatform: not an arm64 object"). The arch comes from the resolved configuration; the
          # deployment version is the profile's, which build-xnu-4k-baseline.sh now passes to the kernel
          # link as well, because check_object compares LC_BUILD_VERSION too.
          STATUS=$(./unixnu status --json -D ../UniXNU-uke)
          export UNIXNU_XNU_ARCH=$(printf '%s' "$STATUS" | python3 -c 'import json,sys; print(json.load(sys.stdin)["board"]["arch"]["name"])')
          # The deployment target is the profile's ios_version, exactly as the driver exports it for the
          # kernel build and as scripts/kernel_target.py audits the archive objects. A hardcoded value
          # here makes the archives 17.0 while the kernel is 26.5.2 (or the reverse), and the object
          # audit stops the round on the first component.
          export UNIXNU_IOS_VERSION=$(printf '%s' "$STATUS" | python3 -c 'import json,sys; print(json.load(sys.stdin)["board"]["os"]["ios_version"])')
          echo "kernel target: $UNIXNU_XNU_ARCH (iOS $UNIXNU_IOS_VERSION)"
          ( cd "$workspace" && python3 scripts/gen-touch-firmware.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py --namespace )
          ( cd "$workspace" && python3 scripts/build-arm-driver.py ArmDTPlatform )
          ( cd "$workspace" && python3 scripts/build-arm-driver.py ArmCpu )
          # The legacy display archive is gated by audit-mobile-graphics-legacy.py, which only accepts a
          # candidate whose recorded original IOMobileFramebufferLegacy executable matches a previously
          # qualified baseline. uke_defconfig wants it; uke-nodisplay_defconfig deliberately does not, and
          # build-xnu-4k-baseline.sh inserts uke_display_probe_stub into bsd/init.c instead, so the link
          # succeeds without it.
          if [ "${{ env.UKE_DEFCONFIG }}" = "uke_defconfig" ]; then
            mkdir -p "$workspace/build/display-analysis"
            UKE_OUT_DIR="$UKE_OUT_DIR" python3 - <<'PY2'
          import json, os
          from pathlib import Path
          p = Path(os.environ['UKE_OUT_DIR']) / 'tree/build/display-analysis/mobile-graphics-legacy-abi.json'
          if not p.exists():
              p.write_text(json.dumps({'runtime_metadata_checkpoint_sha256':
                                       '3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b'}) + '\n')
          PY2
            ( cd "$workspace" && python3 scripts/build-native-legacy-display.py )
            ls -l "$workspace/build/native-legacy-display/" 2>/dev/null || true
          else
            echo "legacy display disabled in ${{ env.UKE_DEFCONFIG }}: no display archive needed (stub path)"
          fi
          ls -l "$workspace/build/corecrypto-2023/"*.a 2>/dev/null | tail -3 || true
          # Upstream's 26/27 kernel archives end with the comparison kernel:
          #   "The 27 kernel archives end with build-fileset-release-reference.py --tree .,
          #    the comparison kernel the prelink step reads." (docs/devices/sheng.md)
          # This repository's configurations cannot carry that entry — [kernel] archives only runs
          # under CONFIG_XNU_BUILD_ARCHIVES, which uke-nodisplay_defconfig does not set — so the same
          # final entry is reproduced here, after the four archives the script asserts.
          if [ "${{ env.UKE_SKIP_PRELINK }}" != "true" ]; then
            ( cd "$workspace" && python3 scripts/build-libpthread-kernel.py )
            ( cd "$workspace" && python3 scripts/build-fileset-release-reference.py --tree . )
            ls -l "$workspace/build/xnu/fileset-reference/" || true
          fi

      # A macOS 26 kernelcache is an MH_FILESET with stripped kext code, so emit_prelink.py matches it
      # against a symbol-bearing comparison kernel. That kernel is built as the last entry of the
      # archive step above, mirroring upstream, and profiles/os/macos-26.5.2-25F84 points prelink at it
      # by a tree-relative path. Fail here with a reason rather than letting the emitter raise
      # FileNotFoundError.
      - name: Check the fileset reference kernel
        # Only the two configurations whose archives this workflow builds itself need the check here.
        # A configuration with CONFIG_XNU_BUILD_ARCHIVES (uke-storage, uke-userland, …) gets the
        # comparison kernel from board.toml [kernel] archives, which the driver runs inside
        # "unixnu build kernel", immediately before prelink — so at this point in the job it does not
        # exist yet, and a check here would fail on a configuration that is doing the right thing.
        if: env.UKE_SKIP_PRELINK != 'true' && contains(fromJSON('["uke_defconfig","uke-nodisplay_defconfig"]'), env.UKE_DEFCONFIG)
        working-directory: UniXNU
        run: |
          set -x
          test -f "$UKE_OUT_DIR/tree/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf" || {
            echo "::error::prelink reads build/xnu/fileset-reference; the archive step builds it last, as upstream's 26/27 archives do. It is missing, so that step did not finish."
            exit 1
          }
          ls -l "$UKE_OUT_DIR/tree/build/xnu/fileset-reference/"

      - name: Link the kernel (prelink included)
        working-directory: UniXNU
        # A port under construction has more than one unknown at a time and make stops at the first,
        # so every run costs a round trip per error. -k carries on and one run reports them all; a run
        # that fails produces no kernel anyway. Recursive make inherits it through MAKEFLAGS.
        env:
          MAKEFLAGS: -k
        run: |
          set -x
          SKIP_PRELINK=""
          if [ "${{ env.UKE_SKIP_PRELINK }}" = "true" ]; then
            SKIP_PRELINK=--skip-prelink
            echo "::warning::skip_prelink=true: the kernel carries no kernelcache kexts, so it can boot and print but cannot mount a root"
          fi
          ./unixnu build kernel $SKIP_PRELINK -D ../UniXNU-uke
          OUT=$(./unixnu status --json -D ../UniXNU-uke | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])')
          echo "UKE_OUT_DIR=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT/kernel"
          test -f "$OUT/kernel/kernel.macho"

      # Judging a round needs the pairing numbers, but the job log and the artifact both require
      # authentication while the run page does not. Putting the numbers in the step summary is what makes
      # a round readable from outside the runner — the same reason the failure report below exists.
      - name: Report the pairing numbers (on success)
        if: success()
        working-directory: UniXNU
        run: |
          set -x
          logs=$(ls -1 out/uke/*/*/logs/prelink.log out/uke/*/*/logs/*fileset*-reference*.log 2>/dev/null || true)
          echo "pairing sources: ${logs:-<none>}"
          {
            echo "## Pairing"
            echo
            echo "\`${{ env.UKE_DEFCONFIG }}\` · core \`${{ env.UKE_CORE_REPO }}@${{ env.UKE_CORE_REF }}\`"
            echo
            echo '```'
            grep -h -E '^functions:|^data:|^kext-facing targets named:|^conflicts:|^unresolved closure references:|^removed [0-9]+ unavailable|reference leaves [0-9]+ undefined' $logs 2>/dev/null \
              || echo 'no pairing lines'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The build log of a whole XNU compile is tens of thousands of lines and a failing make buries
      # the one line that matters among warnings. Printing the diagnostics here puts the reason in the
      # job log itself, which is the only part of a run that can be read without authentication.
      - name: Report the build errors (on failure)
        if: failure()
        working-directory: UniXNU
        run: |
          set -x
          logs=$(ls -1 out/uke/*/*/logs/*.log 2>/dev/null || true)
          if [ -z "$logs" ]; then
            echo "no logs under out/uke/*/*/logs"
            exit 0
          fi
          # The step summary is rendered into the run page itself, and the run page is readable without
          # authentication — the job logs are not. Writing the error lines here is what makes a failure
          # diagnosable from outside the runner.
          {
            echo "## Kernel build failure"
            echo
            echo "\`${GITHUB_JOB}\` · defconfig \`${{ env.UKE_DEFCONFIG }}\` · core \`${{ env.UKE_CORE_REPO }}@${{ env.UKE_CORE_REF }}\` · skip_prelink \`${{ env.UKE_SKIP_PRELINK }}\`"
            echo
            echo '```'
            grep -h -B1 -A3 -E '(^|[^a-zA-Z])error:|fatal error:|undefined (symbol|reference)|ld: |cannot find|needs component entries|only supports|no policy directory' $logs \
              | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are rendered into the run page as plain text, so the first few real failures are
          # repeated as ::error:: lines: that is what a reader without log access can actually see.
          #
          # Each line names the log it came from, and the last matching logs win instead of the first:
          # kernel-bootstrap.log links without the archive builders by design (XNU_BOOTSTRAP=1), so its
          # linker error is tolerated and the pass that matters is a later one. An earlier round annotated
          # exactly that tolerated error and hid the real failure.
          for log in $logs; do
            line=$(grep -m 1 -E '(^|[^a-zA-Z])error:|needs component entries|only supports|no policy directory|undefined symbol|symbol\(s\) not found' "$log" 2>/dev/null | cut -c1-160)
            if [ -n "$line" ]; then echo "$(basename "$log"): $line"; fi
          done | tail -3 | cut -c1-200 | while IFS= read -r line; do
              echo "::error title=build failure::${line}"
            done || true
          for log in $logs; do
            echo "=================== $log ($(wc -l < "$log") lines)"
            echo "------------------- error lines, with context"
            grep -n -B2 -A6 -E '(^|[^a-zA-Z])error:|fatal error:|undefined (symbol|reference)|ld: |No such file or directory|cannot find|Error [0-9]+$' "$log" \
              | head -300 || true
            echo "------------------- last 80 lines"
            tail -80 "$log" || true
          done

      - name: Collect artifacts (always)
        if: always()
        run: |
          set -x
          mkdir -p artifacts
          OUT="${UKE_OUT_DIR:-}"
          if [ -z "$OUT" ] && [ -d UniXNU ]; then
            OUT=$(cd UniXNU && ./unixnu status --json -D ../UniXNU-uke 2>/dev/null \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])' 2>/dev/null || true)
          fi
          echo "collecting from: ${OUT:-<unresolved>}"
          if [ -n "$OUT" ] && [ -f "$OUT/kernel/kernel.macho" ]; then
            cp "$OUT/kernel/kernel.macho" artifacts/
            cp "$OUT/kernel/kernel.json" artifacts/ 2>/dev/null || true
            # The pairing map is the only channel that names which original function an --allow-missing
            # redirect stood in for: Apple publishes no KDK for macOS 26, so the stripped kernelcache has
            # no symbols to compare against, and a device panic only prints the caller address. With the
            # map, stubbed[bundle][address] resolves to the kext that called and the pairing it wanted.
            cp "$OUT/kernel/kernel.map.json" artifacts/ 2>/dev/null || echo "no kernel.map.json" >> artifacts/MISSING.txt
            shasum -a 256 "$OUT/kernel/kernel.macho" | tee artifacts/kernel.macho.sha256
            # The native (pre-emission) kernel with symbols is what the fileset matcher pairs the original
            # collection against. Shipping it turns "write anchors -> wait 35 minutes -> see whether the
            # stub count dropped" into a local loop: kits/XnuPrelink/fileset_match.py runs on the host with
            # this file and the kernelcache. kernel.json records its path.
            native=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("native") or "")' "$OUT/kernel/kernel.json" 2>/dev/null || true)
            if [ -n "$native" ] && [ -f "$native" ]; then
              mkdir -p artifacts/native
              cp "$native" artifacts/native/native.macho
              shasum -a 256 "$native" | tee artifacts/native/native.macho.sha256
            else
              echo "native kernel not collected (kernel.json native=${native:-<none>})" >> artifacts/MISSING.txt
            fi
          else
            echo "kernel.macho was not produced" | tee artifacts/MISSING.txt
          fi
          if [ -n "$OUT" ] && [ -d "$OUT/logs" ]; then
            cp -R "$OUT/logs" artifacts/logs
          else
            echo "no kernel logs to collect" | tee -a artifacts/MISSING.txt
          fi
          if [ -n "${UKE_BS_DIR:-}" ] && [ -d "$UKE_BS_DIR/logs" ]; then
            cp -R "$UKE_BS_DIR/logs" artifacts/bootstrap-logs
          fi
          # The AES interface audit (scripts/audit-aes-interface.py) needs the prelink candidate and its
          # extent plan, which only exist inside the build: without them a SoftwareAES binding can only be
          # the recorded iPadOS 17 one, and prelink addresses do not carry across kernelcaches.
          if [ -n "$OUT" ] && [ -d "$OUT/build/xnu-prelink" ]; then
            mkdir -p artifacts/xnu-prelink
            cp "$OUT/build/xnu-prelink/native-defaults-candidate.macho" artifacts/xnu-prelink/ 2>/dev/null || true
            cp "$OUT/build/xnu-prelink/native-defaults-candidate.json" artifacts/xnu-prelink/ 2>/dev/null || true
            ls -l artifacts/xnu-prelink | head -5
          fi
          ls -lR artifacts | head -60

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uke-kernel-min
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
