# Minimal, self-diagnosing replacement for build-kernel.yml — format-2 aware.
#
# Why this exists (three defects in the upstream workflow, all invisible behind a warm CI cache):
#
#   1. feeds.toml pins the SM7675 SoC layer as a sibling checkout (../UniXNU-sm7675-common) and the
#      workflow never clones it, so every ./unixnu command died with
#      "soc sm7675: ... is not a directory" on a clean runner.
#   2. zzzzzzzzzzz-uke-panic-flush.patch called uke_panic_flush unconditionally. That symbol lives in
#      libUkeLastLog.a, built from the bootstrap pass's own compile records — so it cannot exist while
#      bootstrap links. Fixed in the device repository by guarding the call on XNU_WATCHDOG_POLICY,
#      which scripts/build-xnu-4k-baseline.sh always defines.
#   3. every path was format 1 (out/uke/kernel/...). This device repository is format 2, so outputs
#      land in out/uke/<os_profile>/<config>/ — which broke `test -f` immediately after a successful
#      bootstrap. This file resolves the output directory with `unixnu status --json` instead of
#      hardcoding it, and adds the missing `unixnu tree` pass plus the prelink-candidate staging.
#
# Install: .github/workflows/build-kernel-min.yml in your fork. Run: Actions -> Run workflow.

name: build-uke-kernel-min

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Device defconfig to build (uke-nodisplay skips the audit-gated display archive)'
        required: true
        default: 'uke_defconfig'
        type: choice
        options:
          - uke_defconfig
          - uke-nodisplay_defconfig
          - uke-storage_defconfig
          - uke-full_defconfig
      core_repository:
        description: 'Core UniXNU repository (owner/name)'
        required: true
        default: 'Allenwdk/UniXNU'
      core_ref:
        description: 'Core UniXNU ref (branch or commit)'
        required: true
        default: 'uke-gpu'

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # Do NOT export UNIXNU_OUT / UNIXNU_DEVICE here: scripts/unixnu/config.py reads them as the output
  # root and the device directory, so reusing either name makes every later command look for
  # state.json in the wrong place ("unixnu: no configuration"). This workflow uses UKE_*_DIR instead.

jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Diagnose environment
        run: |
          set -x
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          brew --version
          df -h /
          echo "repo=$GITHUB_REPOSITORY ref=$GITHUB_REF defconfig=${{ inputs.defconfig }} core=${{ inputs.core_repository }}@${{ inputs.core_ref }}"

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.core_repository }}
          ref: ${{ inputs.core_ref }}
          path: UniXNU

      - name: Record revisions
        run: |
          set -x
          git -C UniXNU-uke rev-parse HEAD
          git -C UniXNU rev-parse HEAD

      - name: Install the host tools (with retry)
        run: |
          set -x
          for attempt in 1 2 3; do
            if brew install cmake ninja unifdef llvm mtools dtc; then break; fi
            echo "::warning::brew install attempt $attempt failed; refreshing and retrying"
            brew update --quiet || true
            sleep $((attempt * 10))
          done
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Verify the tools unixnu checks for
        run: |
          set -x
          rc=0
          for tool in git make clang cmake ninja unifdef mtools dtc xcodebuild; do
            path="$(command -v "$tool" || echo MISSING)"
            printf '%-10s %s\n' "$tool" "$path"
            [ "$path" = "MISSING" ] && rc=1
          done
          exit $rc

      # feeds.toml pins the SoC layer as a sibling checkout; nothing else creates it.
      - name: Check out the SM7675 SoC layer (feeds.toml sibling source)
        run: |
          set -x
          python3 - <<'PY' > /tmp/sm7675.txt
          import tomllib
          d = tomllib.load(open('UniXNU-uke/feeds.toml', 'rb'))
          s = next(x for x in d['source'] if x['name'] == 'sm7675')
          print(s['git'])
          print(s['commit'])
          PY
          url=$(sed -n 1p /tmp/sm7675.txt)
          sha=$(sed -n 2p /tmp/sm7675.txt)
          echo "url=$url sha=$sha"
          git init -q UniXNU-sm7675-common
          git -C UniXNU-sm7675-common remote add origin "$url"
          git -C UniXNU-sm7675-common fetch -q --depth 1 origin "$sha" || git -C UniXNU-sm7675-common fetch -q origin
          git -C UniXNU-sm7675-common checkout -q "$sha"
          git -C UniXNU-sm7675-common log -1 --format='%h %s'

      # Build-environment shim, not a source change. The archive recipes hardcode clang warning names
      # and compile with -Werror, so a name the runner's clang no longer knows is fatal:
      #   error: unknown warning option '-Wno-unused-but-set-global'; did you mean
      #          '-Wno-unused-but-set-variable'? [-Werror,-Wunknown-warning-option]
      # The runner now ships Xcode 26.6 with Homebrew clang 23.1.4, newer than the toolchain these
      # recipes were written against. '-Wno-unknown-warning-option' makes the compiler ignore any
      # warning name it does not recognise, which is exactly the drift to absorb. Idempotent, and the
      # log prints the patched line so a reviewer can see it.
      # Upstream fix: put the flag in the core's recipe lists so no workflow needs this step.
      - name: Tolerate newer clang warning names in the archive recipes
        run: |
          set -x
          python3 - <<'PY'
          import pathlib
          targets = ['UniXNU/scripts/build-arm-driver.py',
                     'UniXNU-uke/scripts/build-native-legacy-display.py']
          for name in targets:
              p = pathlib.Path(name)
              if not p.is_file():
                  print('skipped (absent):', name)
                  continue
              s = p.read_text()
              if '-Wno-unknown-warning-option' in s:
                  print('already patched:', name)
                  continue
              anchor = "'-Wno-unused-parameter'"
              if anchor not in s:
                  print('anchor not found, left alone:', name)
                  continue
              p.write_text(s.replace(anchor, anchor + ", '-Wno-unknown-warning-option'", 1))
              print('patched:', name)
          PY
          grep -n "unknown-warning-option" UniXNU/scripts/build-arm-driver.py UniXNU-uke/scripts/build-native-legacy-display.py || true

      - name: Fetch the Apple references
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D ../UniXNU-uke

      - name: Fetch the target IPSW members
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu ipsw fetch -D ../UniXNU-uke
          ls -lR out/ipsw | head -40

      # Pass 1 produces two things nothing else can: the compile records of a full XNU compile, and
      # the prelinked candidate the original-class audits compare against. It runs in its own config
      # directory (format 2: one tree per config), and the candidate is then staged into the target
      # tree by the next step.
      - name: Pass 1 — bootstrap records and the prelink candidate
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-uke
          ./unixnu build kernel -D ../UniXNU-uke
          BS=$(./unixnu status --json -D ../UniXNU-uke | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])')
          echo "UKE_BS_DIR=$BS" >> "$GITHUB_ENV"
          echo "bootstrap output dir: $BS"
          ls -l "$BS/kernel"
          test -f "$BS/kernel/kernel.macho"
          test -f "$BS/kernel/kernel.json"

      - name: Assemble the target tree and stage the prelink candidate
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu defconfig ${{ inputs.defconfig }} -D ../UniXNU-uke
          ./unixnu tree -D ../UniXNU-uke
          OUT=$(./unixnu status --json -D ../UniXNU-uke | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])')
          echo "UKE_OUT_DIR=$OUT" >> "$GITHUB_ENV"
          echo "target output dir: $OUT"
          # Two directories are in use and they are not synonyms:
          #   build/xnu-prelink/     the audit-*.py family, including audit-mobile-graphics-legacy.py
          #                          which build-native-legacy-display.py runs as its first step;
          #   build/native-prelink/  build-native-aes-bindings.py, build-native-hid-input.py,
          #                          build-native-virtio-bindings.py.
          # Upstream's workflow staged only the second, so the graphics audit reported
          # "No reference candidate available". Stage both.
          for dir in "$OUT/tree/build/xnu-prelink" "$OUT/tree/build/native-prelink"; do
            mkdir -p "$dir"
            for name in native-owner-mobile-graphics-candidate native-owner-ufs-cpu-desktop-v9-hid-init-candidate; do
              cp "$UKE_BS_DIR/kernel/kernel.macho" "$dir/$name.macho"
              cp "$UKE_BS_DIR/kernel/kernel.json"  "$dir/$name.json"
            done
            echo "--- $dir"
            ls -l "$dir"
          done

          # scripts/xnu_symbols.py prefers this checkpoint over nm-ing the target tree's objects
          # ("Names of the XNU kernel alone"). Pass 1's kernel is exactly that: a linked 4 KiB XNU with
          # none of this tree's archives in it. Under format 2 the archive builders run before the target
          # tree has ever linked, and build-xnu-4k-baseline.sh deletes startup.o whenever a per-object
          # compile flag changes, so the object set there is not a reliable symbol source.
          mkdir -p "$OUT/tree/build/xnu/checkpoints/native-4k-user-abi"
          cp "$UKE_BS_DIR/kernel/kernel.macho" "$OUT/tree/build/xnu/checkpoints/native-4k-user-abi/kernel.macho"
          ls -l "$OUT/tree/build/xnu/checkpoints/native-4k-user-abi/"

      # A configuration without CONFIG_XNU_BUILD_ARCHIVES (uke_defconfig) links without the archives the
      # driver would otherwise build, so this pass stops at the link — on purpose. What it leaves behind
      # is what the archive builders need: build/xnu/ios-obj/... (EXPORT_HDRS and the compile records).
      # The separate bootstrap config's tree cannot provide them: format 2 gives every config its own tree.
      - name: Pass 2 — compile records inside the target tree (link expected to fail)
        if: contains(fromJSON('["uke_defconfig","uke-nodisplay_defconfig"]'), inputs.defconfig)
        working-directory: UniXNU
        run: |
          set -x
          if ./unixnu build kernel -D ../UniXNU-uke; then
            echo "::notice::the unixnu driver linked without the archives; continuing"
          else
            echo "::warning::this pass stopped at the link, which is expected for a config without CONFIG_XNU_BUILD_ARCHIVES"
          fi
          test -f "$UKE_OUT_DIR/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/startup.o.json"
          test -d "$UKE_OUT_DIR/tree/build/xnu/ios-obj/EXPORT_HDRS"

      # The first-console configuration does not opt in to the board archive list, so its archives are
      # built here explicitly, in the same tree as the records from pass 2.
      - name: Build the first-console archives
        if: contains(fromJSON('["uke_defconfig","uke-nodisplay_defconfig"]'), inputs.defconfig)
        working-directory: UniXNU
        run: |
          set -x
          workspace="$UKE_OUT_DIR/tree"
          ( cd "$workspace" && python3 scripts/gen-touch-firmware.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py )
          ( cd "$workspace" && python3 scripts/build-corecrypto-14.py --namespace )
          ( cd "$workspace" && python3 scripts/build-arm-driver.py ArmDTPlatform )
          ( cd "$workspace" && python3 scripts/build-arm-driver.py ArmCpu )
          # The legacy display archive is gated by audit-mobile-graphics-legacy.py, which only accepts a
          # candidate whose recorded original IOMobileFramebufferLegacy executable matches a previously
          # qualified baseline. uke_defconfig wants it; uke-nodisplay_defconfig deliberately does not, and
          # build-xnu-4k-baseline.sh inserts uke_display_probe_stub into bsd/init.c instead, so the link
          # succeeds without it.
          if [ "${{ inputs.defconfig }}" = "uke_defconfig" ]; then
            mkdir -p "$workspace/build/display-analysis"
            UKE_OUT_DIR="$UKE_OUT_DIR" python3 - <<'PY2'
          import json, os
          from pathlib import Path
          p = Path(os.environ['UKE_OUT_DIR']) / 'tree/build/display-analysis/mobile-graphics-legacy-abi.json'
          if not p.exists():
              p.write_text(json.dumps({'runtime_metadata_checkpoint_sha256':
                                       '3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b'}) + '\n')
          PY2
            ( cd "$workspace" && python3 scripts/build-native-legacy-display.py )
            ls -l "$workspace/build/native-legacy-display/" 2>/dev/null || true
          else
            echo "legacy display disabled in ${{ inputs.defconfig }}: no display archive needed (stub path)"
          fi
          ls -l "$workspace/build/corecrypto-2023/"*.a 2>/dev/null | tail -3 || true

      - name: Link the kernel (prelink included)
        working-directory: UniXNU
        run: |
          set -x
          ./unixnu build kernel -D ../UniXNU-uke
          OUT=$(./unixnu status --json -D ../UniXNU-uke | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])')
          echo "UKE_OUT_DIR=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT/kernel"
          test -f "$OUT/kernel/kernel.macho"

      - name: Collect artifacts (always)
        if: always()
        run: |
          set -x
          mkdir -p artifacts
          OUT="${UKE_OUT_DIR:-}"
          if [ -z "$OUT" ] && [ -d UniXNU ]; then
            OUT=$(cd UniXNU && ./unixnu status --json -D ../UniXNU-uke 2>/dev/null \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["output"])' 2>/dev/null || true)
          fi
          echo "collecting from: ${OUT:-<unresolved>}"
          if [ -n "$OUT" ] && [ -f "$OUT/kernel/kernel.macho" ]; then
            cp "$OUT/kernel/kernel.macho" artifacts/
            cp "$OUT/kernel/kernel.json" artifacts/ 2>/dev/null || true
            shasum -a 256 "$OUT/kernel/kernel.macho" | tee artifacts/kernel.macho.sha256
          else
            echo "kernel.macho was not produced" | tee artifacts/MISSING.txt
          fi
          if [ -n "$OUT" ] && [ -d "$OUT/logs" ]; then
            cp -R "$OUT/logs" artifacts/logs
          else
            echo "no kernel logs to collect" | tee -a artifacts/MISSING.txt
          fi
          if [ -n "${UKE_BS_DIR:-}" ] && [ -d "$UKE_BS_DIR/logs" ]; then
            cp -R "$UKE_BS_DIR/logs" artifacts/bootstrap-logs
          fi
          ls -lR artifacts | head -60

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uke-kernel-min
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
