name: validate

# Fast push checks. The macOS kernel build is expensive and lives in
# build-kernel.yml, which is dispatch-only. This workflow catches the errors
# that used to surface only after a kernel build: malformed workflow/toml,
# broken shell or Python syntax, and a patch series that no longer applies in
# the kernel build's order.

on:
  push:
    branches: [main]
    paths:
      - 'board.toml'
      - 'feeds.toml'
      - 'unixnu.lock'
      - 'configs/**'
      - 'drivers/**'
      - 'kits/**'
      - 'package/**'
      - 'patches/**'
      - 'scripts/**'
      - 'docs/MACOS-BUILD.md'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke-gpu
          path: UniXNU
          submodules: recursive

      # Two cores, because this repository needs two different things from them and they do not live in
      # the same place. The upstream uke-gpu checkout above is what carries drivers/NativeAdreno, which
      # the host profile test compiles against. The patches/xnu series, however, is authored against the
      # fork the kernel build at build-kernel-min.yml actually uses (TongHuaQWQ/UniXNU@macos, its
      # UKE_CORE_REPO/UKE_CORE_REF defaults); checking the device patches against the upstream series
      # instead reports a conflict that no build can see, which is what this step did until now --
      # native-smp-secondary-bcm2837.patch failed on osfmk/arm64/start.s:143 while the fork the build
      # uses applies all 145 patches cleanly.
      - name: Check out the core the device patch series is written against
        uses: actions/checkout@v4
        with:
          repository: TongHuaQWQ/UniXNU
          ref: macos
          path: UniXNU-macos

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the YAML parser
        run: python3 -m pip install --quiet pyyaml

      - name: Check the workflow, board and source syntax
        working-directory: UniXNU-uke
        run: |
          python3 -c "import pathlib,tomllib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]; tomllib.loads(pathlib.Path('board.toml').read_text()); tomllib.loads(pathlib.Path('feeds.toml').read_text()); tomllib.loads(pathlib.Path('unixnu.lock').read_text()); print('ok workflow/board/feeds/lock')"
          for script in scripts/*.sh; do bash -n "$script"; done
          find scripts -name '*.py' -print0 | xargs -0 python3 -m py_compile
          echo 'ok shell and python syntax'

      - name: Check the Adreno 732 profile and generated headers
        working-directory: UniXNU-uke
        # Host-only: the profile test compiles against the checked-out
        # NativeAdreno sources, and prepare-uke-gmu.py assembles the headers
        # from the recorded live-DT facts. No firmware or device is needed.
        run: |
          python3 scripts/check-uke-gpu.py
          python3 scripts/check-uke-gpu-host.py --kit ../UniXNU/drivers/NativeAdreno
          python3 scripts/check-gpu-power-host.py

      - name: Apply the XNU patch set to a clean tree
        working-directory: UniXNU-uke
        # board.toml [kernel] patch_series is resolved against this core: arch, then OS, then device.
        # It is the same 145-patch series, in the same order, that the kernel build applies -- the
        # script reads the three series files instead of globbing the patch catalogs, because the
        # catalogs hold patches no profile selects.
        env:
          UNIXNU_CORE: ${{ github.workspace }}/UniXNU-macos
        run: bash scripts/check-xnu-patch-set.sh
