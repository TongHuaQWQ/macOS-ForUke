# Board description of the Xiaomi Pad 7 (uke, SM7675), read by the unixnu build driver.
schema_version = 2

[board]
name = "uke"
soc = "SM7675"
soc_source = "sm7675"
os_profile = "macos-27.3-uke"    # thin macOS 27.3 profile: upstream 26C5035r identity + its 53-patch
                                  # xnu-12377 series, none of the sheng board's [adt]/[root]/[userdata]
description = "Xiaomi Pad 7"
kit = "uke"                      # the package/ of this repository appears as kits/uke in the build tree

# The packaging half of the board (docs/porting/packaging.md): scripts/package.sh is the UniXNU
# repository's templates/package.sh copied unchanged, and it reads exactly one board value here — the
# path of the driver. Everything else the run needs comes from the sections below and the profile.
[package]
# The UniXNU checkout beside this repository. Both layouts this board is built in are siblings: the
# workspace (work/push/macOS-ForUke + work/push/UniXNU) and .github/workflows/package.yml, which
# checks the device repository out as `device/` and the core as `UniXNU/` next to it.
unixnu = "../UniXNU"
# The `boot` partition of this unit, from `fastboot getvar all` (docs/STATE.md §18: boot_a/b and
# vendor_boot_a/b are 0x6000000 each, 96 MiB). verify refuses a larger boot.img; the shim + firmware
# volume + device tree + payload ramdisk of this board are many times smaller, so this is the device's
# limit and not a budget the build spends.
boot_partition_bytes = 0x6000000

# The configuration each OS profile packages. "unixnu release" always selects through this table, so a
# profile named here never depends on the out/ state of the machine that runs it.
[package.defconfig]
# macos-27.3-uke — profiles/os/macos-27.3-uke, this board's own thin 26C5035r identity: the macOS
# prelink track. configs/uke-macos_defconfig sets CONFIG_XNU_BUILD_ARCHIVES=y, which is what makes the
# kernel step build the archives the prelink reads.
"macos-27.3-uke" = "uke-macos_defconfig"
# macos-27.3-26C5035r — upstream's own 27.3 profile, the identity [ipsw] declares (Mac17,11 / k114cap /
# 26C5035r): the baseline configuration, the same one [kernel] defconfig names. It builds a boot-test
# kernel without the archive chain, exactly as the CI round builds it beside the prelink candidate.
"macos-27.3-26C5035r" = "uke_defconfig"

# The full component selection; the resolver adds dependencies and orders their recipes.
[components]
include = [
  "ArmDTPlatform", "ArmCpu", "ArmVirtPlatform",
  # ShengUfs is deliberately absent: archive_plan() requires an archives entry for every selected
  # kernel-stage component, and its arm64e recipe needs the profile's signed root policy. It returns
  # together with the policy directory.
  # ShengHidInput is absent for the same reason as ShengUfs: build-sheng-hid-input.py refuses any
  # target except arm64 iOS 17 ("The original HID ABI builder only supports arm64 iOS 17"), and its
  # suggested replacement, build-sheng-source-drivers.py, is a compile audit whose output still needs
  # target-family linking. The menu counts down and boots without an input device, so a prelink round
  # does not need the touch driver.
  "SoftwareAES", "ShengNovatekTouch", "AppleKeyStoreState",
  "RamBlock", "VirtioMmioBlock", "VirtioMmioConsole",
  # GPU is its own track: its kernel-side components need the A732 firmware pins
  # (.cache/firmware/uke-gpu) and the owner-built Metal plug-in, which a public runner cannot produce,
  # and kernel.py:archive_plan requires every selected component with a kernel build recipe to appear
  # in [kernel] archives. Restore these three lines together with the GPU archive entries.
  # "Adreno740", "AdrenoMetal",
  "GopFramebuffer", "QcomGeniSpi",
  "XnuPrelink", "DarwinBoot", "VerifiedRoot", "AirNir", "AdrenoPM4", "AdrenoFirmware", "ArmSmmu4K",
]

# The target OS image: the macOS 27.3 universal restore image (it replaced the iPad7,1 iPadOS 17.7.11 image
# this board was first ported against, and then the macOS 26.5.2 one). Give --ipsw PATH to use a local file;
# without it the remote url is read with range requests, only the members that are needed.
[ipsw]
# macOS 27.3 (26C5035r) universal restore image — upstream's, the one profiles/os/macos-27.3-uke declares.
# One IPSW serves 50+ boards, so the identity is picked by the four fields below; every kernelcache and
# system volume is one of its BuildManifest entries.
#
# `fetch` is deliberately NOT overridden here: entries are BuildManifest COMPONENT names, and the path
# is resolved through Manifest[component].Info.Path. A file name such as kernelcache.release.mac17j is
# not a component and fails with "component ... is not in this IPSW". The OS profile asks for
# KernelCache, DeviceTree, StaticTrustCache, Cryptex1,SystemTrustCache and — new in 27.3 —
# Cryptex1,AppTrustCache; the identity below (k114cap, Mac17,11, ApChipID 0x6050, ApBoardID 0x04) is the
# identity upstream's 27.3 profile prelinks, kernelcache.release.mac17j.
#
# Nothing here is re-verified against the 26C5035r BuildManifest: this tree holds no such image, and the
# 1527-member count above was measured on the 25F84 one. Before the first build, fetch the cache and read
# the resolved member name:
#   unixnu ipsw fetch -D . KernelCache DeviceTree
# and check that Cryptex1,AppTrustCache exists in the 27.3 manifest (it does not exist in 25F84's
# component list as far as this repository can tell), because a missing component fails the same call.
url = "https://updates.cdn-apple.com/2026FallSeed/53df7654-4865-4259-8dae-30177b76f104/UniversalMac_27.3_26C5035r_Restore.ipsw"
product = "Mac17,11"
version = "27.3"
build = "26C5035r"
device_class = "k114cap"
chip_id = 24656                      # 0x6050 — the identity upstream's 27.3 profile names for Mac17,11
board_id = 4

[ipsw.sha256]
# Empty on purpose: the two 044-*.dmg pins that were here belong to the iPadOS image and name members
# this port's restore image does not contain, so they could never match. The member names change with the
# image as well: 094-56453-094.dmg.aea (OS), 094-56679-096.dmg.aea (Cryptex1,SystemOS) and
# 022-21678-099.dmg.aea (BaseSystem) are the 25F84 ones, the 26C5035r manifest names its own. Pinning
# them means hashing the multi-GiB members once, which happens with the userdata step rather than here.

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# first_lba and last_lba are the GPT entry "userdata" of LUN 0, read from the tablet.
[userdata]
first_lba = 0x2d3000
last_lba = 0x38417fa             # this unit: 58,988,539 x 4096 B = 225.0 GiB (12 GB reference: 0x3b147fa)
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "uke_defconfig"
# Declared explicitly: the iOS chain uses the arch profile's four-layer default, but a macOS guest
# drops the soc layer (see the note below) and carries what it still needs in this repository.
# No soc layer: UniXNU-sm7675-common's soc series targets xnu-10063; its one still-needed hunk
# (the MPIDR core numbering) lives in patches/xnu/native-smp-secondary-bcm2837.patch.
patch_series = ["arch:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# The four-layer series of the resolver: shared arch patches, the SoC platform
# patches, the OS patches and the board's own. Empty fragments: the board's
# defconfigs carry the full configuration.
config_fragments = []
# Archive builders of the kernel step, in order. They run only for a configuration with
# CONFIG_XNU_BUILD_ARCHIVES=y (configs/uke-full_defconfig), after the bootstrap pass has left the
# compile records behind. component: entries are catalog recipes; the rest are scripts of the
# build tree with their arguments.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:ArmVirtPlatform",
  "component:SoftwareAES",
  # The overlay below is now the measured mac17g layout (native-aes-original-bindings.S was
  # rewritten from mac17g's own symbol table), so the step can run again.
  "build-software-aes-bindings.py",
  # WITHOUT build-software-aes-bindings.py. The overlay it compiles is in the core checkout
  # (scripts/data/native-aes-original-bindings.S), so the step itself would run — but its `.set`
  # values are the measured iPadOS 17.7.11 prelink layout of IOAESAccelerator (0xfffffff004a8…), and
  # prelink-ABI addresses do not carry across kernelcaches (same argument as build-sheng-platform-power.py
  # below). With the step absent, libSoftwareAES.a(NativeAES.o) imported createSpecialKeys,
  # performAESQuantum, completeAESQuantum, disableHardwareKey, performImmediateAES, the base
  # constructor and the destructor with nothing to define them, and run 41387605078 died at the link.
  # CONFIG_XNU_NATIVE_AES is off in configs/uke-macos_defconfig for this round, which keeps that
  # archive out of the link entirely. Reinstating both needs an audit of mac17g's own collection (the
  # extent emit_prelink.py plans for com.apple.iokit.IOCryptoAcceleratorFamily), not a re-pinned
  # address set.
  "prepare-storage-headers.py",
  # WITHOUT the two UFS entries — component:ShengUfs and build-arm-driver.py NativeUfs --unverified —
  # for the prelink round. On arm64e the component delegates to build-sheng-source-storage.py, which
  # authenticates every read against the OS profile's signed root policy and has none for 25F84; the
  # classic driver it falls back to was written against the iPadOS 17 IOStorageFamily headers and does
  # not compile against the 26-train headers prepare-storage-headers.py prepares. Neither belongs to
  # this round: the point here is whether the collection's own kexts load. Dropping them cannot break
  # the link — the 12377 series mentions NativeUfs only as a device-tree IOClass string — and the
  # payload is built with native-ufs-root=0 so nothing dereferences the missing driver.
  # Storage returns with the source runtime and a policy directory derived from the system volumes.
  # "component:ShengUfs",
  # "build-arm-driver.py NativeUfs --unverified",
  # WITHOUT build-ufs-original-bindings.py: it binds IOBlockStorageDevice from a *prelinked* candidate
  # and insists the plan's original_sha256 equals kernelcache.release.ipad7 (f18b4df8… in the script),
  # so on this port it fails twice over — the provenance is the iPadOS 17 image, and the candidate this
  # workflow stages comes from a --skip-prelink build whose JSON carries no prelink plan at all.
  # Entry above already asks for the unverified bindings, which is what this port uses.
  "component:RamBlock",
  "component:VirtioMmioBlock",
  "component:VirtioMmioConsole",
  "build-mockfs-fixture.py",
  # WITHOUT build-sheng-platform-power.py: it inherits ApplePMGR AON slot addresses from a recorded
  # audit and refuses any kernelcache other than kernelcache.release.ipad7 (same f18b4df8…) —
  # "Recorded bindings are for another kernelcache". Those addresses are prelink-ABI values that do not
  # carry across kernelcaches, so re-pinning the hash would bind the wrong ones. CONFIG_XNU_SHENG_PMGR
  # stays on, and its call site (zzz-boot-progress.patch) is not in this arch series, so the define is
  # inert here and nothing needs the archive to link.
  # "build-sheng-platform-power.py",
  "build-libpthread-kernel.py",
  # "component:ShengHidInput",
  "component:AppleKeyStoreState",
  # --- not runnable on a public runner; re-enable when the inputs exist -------------------------
  # Kept visible instead of deleted so the full build's shape stays readable.
  #
  #   prepare-uke-gmu.py / component:Adreno740 / build-native-adreno-kits.py /
  #   build-adreno740-accelerator.py
  #       need the A732 GPU firmware pins in .cache/firmware/uke-gpu (extracted from the device's
  #       /vendor/firmware_mnt/image and /odm/firmware — see proprietary-files.txt).
  #   build-native-legacy-display.py
  #       gated by audit-mobile-graphics-legacy.py against a previously qualified candidate.
  #   build-gpu-addon-blob.py
  #       packs the owner-built Metal plug-in bundle, which no clean tree has.
  #
  # "prepare-uke-gmu.py",
  # "component:Adreno740",
  # "build-native-adreno-kits.py",
  # "build-adreno740-accelerator.py",
  # "build-native-legacy-display.py",
  # "build-gpu-addon-blob.py",
  # build-boot-log.py compiles package/{UkeLastLog,BootWatchdogPolicy,CrashLogProbe}.c with this
  # kernel's own ABI. UkeLastLog is what puts a msgbuf snapshot into the pram window every 500 ms
  # (sheng-log=1 in kernel_args), and the UEFI side (ukePkg/Drivers/UkeUsbLogDxe) copies that window
  # into a RAM disk it serves over USB, which is how a kernel log becomes readable without a
  # photograph. The other two are inert here (XNU_WATCHDOG_POLICY and CONFIG_XNU_BOOT_PROGRESS are
  # off) but they are what the device series calls into, so keep them compiling.
  "build-boot-log.py",
  # The CDC-ACM log console over DWC3 (package/uke_usb.c, ported from the sirius port). Its object
  # joins libUkeLastLog.a, so this must come after build-boot-log.py.
  "build-uke-usb.py",
  # libQcomXnuUsbDebug.a (package/qcom-usb-debug), built against this tree's own compile records with
  # soc/Uke.h. The kernel links it when CONFIG_XNU_QCOM_USB_DEBUG is on, which it now is.
  "build-qcom-usb-debug.py",
  # libUkeUfsLog.a (package/UfsLog.cpp + package/UfsLogKernel.c): the freestanding UFS transport that
  # gives UkeLastLog.c's userdata half its native_ufs_log_* symbols without CONFIG_XNU_NATIVE_UFS.
  # configs/uke-macos_defconfig force-loads it through CONFIG_XNU_EXTRA_LD_ARCHIVES, so a configuration
  # with CONFIG_XNU_LOG_USERDATA=y links it and one without builds it and links nothing.
  "build-ufs-log.py",
  # The comparison kernel the fileset prelink reads, last, as upstream's 26/27 archives do:
  #   "The 27 kernel archives end with build-fileset-release-reference.py --tree ., the comparison
  #    kernel the prelink step reads." (docs/devices/sheng.md)
  # It asserts the four archives above it (corecrypto both flavours, ArmDTPlatform, ArmCpu, libpthread),
  # so the position matters. It runs only for a configuration with CONFIG_XNU_BUILD_ARCHIVES=y; the
  # workflow builds it explicitly for uke-nodisplay_defconfig, which has no archives.
  # --lto (round-b2): the native kernel is LTO now and the matcher's `pac-checked-shape` anchors went
  # 113 -> 1,059 while `reference-order` stayed flat at ~4,39x -- because this comparison kernel was
  # still the non-LTO snapshot. Its earlier --lto attempt died before linking and the reason was
  # invisible; the builder now prints it and the artifact carries fileset-reference/*.log, so retry
  # with the diagnostics in place (docs/11 §38).
  "build-fileset-release-reference.py --tree . --lto",
]

# Adreno 732 (uke) board values for the native GPU driver. The driver carries
# an A740 and an A732 profile; scripts/check-uke-gpu.py compares these values
# with a device DT dump, and scripts/prepare-uke-gmu.py turns the recorded DT
# facts into the headers NativeAdreno consumes. The catalog values are from
# MCC45TR/senemos-uke-kernel-mainline patch 0036 (public A732 entry), not a
# device run.
[gpu]
model = "Adreno732"
chip_id = "0x43030b00"
compatible = "qcom,adreno-gpu-gen7-11-0"
family = "ADRENO_7XX_GEN2"
gpu_base = "0x3d00000"
gpu_size = "0x40000"
gmu_base = "0x3d68000"
gmu_size = "0x37000"
gmu_pdc_base = "0xb280000"
gmu_pdc_size = "0x10000"
gpucc_base = "0x3d90000"          # qcom,cliffs-gpucc
gpucc_size = "0xa000"
gcc_base = "0x100000"             # qcom,cliffs-gcc
smmu_base = "0x3da0000"
smmu_size = "0x40000"
sid_user = 0x00
sid_secure = 0x02
sid_gmu = 0x05
gmem_bytes = "0x180000"           # 1.5 MiB
gmu_chip_id = "0x70b0000"         # a6xx_info.gmu_chipid for 0x43030b00
gmu_cgc_mode = "0x00020202"
preempt_record_bytes = "0x225000"  # 2196 KiB
# Reserved GMU payload pool: physical pages the driver adopts over IODeviceMemory::withRange
# instead of allocating from the kernel VM after userland has wired it. Must match the ADT's
# gmu-memory node (scripts/make-uke-adt.py) and the "GMU Pool" entry of the uke UEFI memory map.
gmu_pool_base = "0xc8000000"
gmu_pool_bytes = "0x2000000"
ubwc_version = 4
ubwc_swizzle = 3                  # levels 2 and 3
highest_bank_bit = 16
gmu_core_clock_hz = 220000000     # GMU core clock target for the A732
gmu_hub_clock_hz = 200000000
# Collected from the rooted device on 2026-10-21. The firmware is gen71100
# (matching compatible qcom,adreno-gpu-gen7-11-0), not the gen71500 sibling.
frequencies_mhz = [950, 900, 835, 736, 684, 633, 500, 353, 255]
num_pwrlevels = 9
initial_pwrlevel = 8
min_pwrlevel = 8
max_pwrlevel = 0
firmware_sqe = ["gen71100_sqe.fw", "gen71500_sqe.fw", "a732_sqe.fw"]
firmware_gmu = ["gen71100_gmu.bin", "gen71500_gmu.bin", "a732_gmu.bin"]
firmware_zap = ["gen71100_zap.mbn", "gen71500_zap.mbn", "a732_zap.mbn"]
firmware_source = "/vendor/firmware + /odm/firmware"

[gpu.firmware_pins."gen71100_sqe.fw"]
bytes = 66036
sha256 = "b6df660d109504dbea5a266910b037a33d893a11c6de52f524a5fd112008c401"

[gpu.firmware_pins."gen71100_gmu.bin"]
bytes = 80680
sha256 = "435c7bac9a328b8a100df930b84b65b4d579e42be44785d0e60e3729291bb864"

[gpu.firmware_pins."gen71100_zap.mbn"]
bytes = 12088
# Pulled from this unit (uke, 2410CRP4CC) at /odm/firmware/gen71100_zap.mbn on a stock Android
# build; the size matched the inherited pin (12,088 B) but the digest did not, so the pin above
# came from another build or SKU. scripts/check-uke-gpu.py compares against this value.
sha256 = "78530c380db9506149703db508ad960a966ec449b02fc8d2de90972e66bc9301"

[kernel.prelink]
# kits/XnuPrelink is the catalog's own path for this kit (components.toml: path = "kits/XnuPrelink").
# The tree materialises the kits/<feed name> symlinks from feeds.toml, and the board copy is the
# `XnuPrelink` entry there, so the alias name kits/NativePrelink does not exist in the tree: naming it
# here made pass 3 die with
#   can't open file '.../tree/kits/NativePrelink/emit_prelink.py': [Errno 2] No such file or directory
# (CI runs 42080292233 and the one after it). The compatibility alias is provided in this repository
# as a symlink for the audit scripts that hardcode it, which is all it was ever needed for.
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# kernelcache.release.mac17j — the KernelCache entry of the k114cap/Mac17,11 identity declared in
# [ipsw] (26C5035r), read through the same pipeline the driver uses (IM4P payload, LZFSE decode, keep
# the single 0x0100000c slice).
#
# INHERITED, NOT MEASURED HERE: this digest is upstream's for exactly this member of exactly this
# identity (profiles/os/macos-27.3-26C5035r, [kernel.prelink] kernelcache_sha256), and no 26C5035r image
# exists in this tree to confirm it against. That is the same class of value the comment below warns
# about, so treat it as a fetch-time check rather than a measurement; kernel.prelink() compares it and
# stops with "does not match the kernelcache this board was qualified against" if it differs. To settle it:
# fetch the KernelCache member of that image, run it through the driver's decode, and hash the Mach-O.
#
# The values it replaces: 697e01d6… was kernelcache.release.mac17g of the 25F84 image (the identity this
# board declared until the OS profile moved to 27.3, and still the cache the uke prelink round was
# measured against), and f18b4df8… before that was kernelcache.release.ipad7 — the iPadOS 17.7.11 image
# the board was ported against; scripts/inspect-target-prelink.py still asserts it for that cache.
# Inherited pins are silent with the wrong IPSW and only fail here, at fetch time.
kernelcache_sha256 = "d1003b5143ffd88439b4d45b6017f587171cfe6855660bed05370a2ea5db9fe9"
slide = "-0x1000000"
# Unchanged from the 25F84 round, and unverified for this collection: upstream's 27.3 profile declares no
# slide at all (it describes mac17j as a fileset that stays at its linked addresses, "there is no slide"),
# while this board has slid the mac17g collection by -0x1000000 since the port began. Whether that offset
# is still right for mac17j cannot be settled without the 26C5035r kernelcache; a wrong slide shows up as
# a kernel that faults at its first fetch, not as a build error.
# No early_security_init: the inherited address (0xfffffff005ab4ae0) is the AMFI entry of the iPadOS
# 17.7.11 kernelcache — docs/devices/nx769j.md records exactly that value as belonging to that profile
# and 0xfffffff004e2b640 to its own, so a prelink ABI address never carries over. It also has to be
# re-derived from mac17g's __PRELINK_INFO, and the caihong/nx769j records say running AMFI early
# security init on a SoC with no Apple PMGR panics with "AMFI: No PMGR?" — uke is a Snapdragon. Boot
# without the hook first and only then, if AMFI trust blocks userland, read the address out of mac17g.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "uke"                   # Resources/Configs/uke.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/ukePkg/uke.dsc"
fd = "Build/ukePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-uke.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "uke"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "uke-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
volume = "UKEESP"
size_mib = 80
# A prelinked macOS kernel is a kernel collection: its image is as large as the original kernelcache
# (132.8 MiB for the 25F84 collection; the 26C5035r one is not measured here), and vendor_boot_a is
# 96 MiB (0x6000000). The payload therefore carries
# Payloads/kernel.macho.lzma (22.8 MiB, LZMA_ALONE) and DarwinBoot decompresses it before parsing;
# a boot-test kernel is a plain MH_EXECUTE and stays uncompressed, because the loader reads the plain
# file first. See docs/11 §27 and docs/13 §5.
compress_kernel = true
loader = "firmware"
title = "macOS 27.3 (26C5035r) - self-built 4K XNU"
# The firmware's Tools menu: without it the payload carries no Tools entry and the Advanced Logger QR
# exporter (Driver/AdvancedLogDxe) has no way in. payload.py:243 emits the entry only when this is set.
tools = true
# Which entry the countdown picks. "tools" reaches Tools -> Advanced Logger (the QR log exporter) on a
# board with no usable keys; "xnu" is the normal boot.
default = "xnu"
dram_size = "0x13FE00000"            # XNU VM DRAM: this unit's whole high run (0x8C0000000-0xA0000000, 5 GiB).
                                     # 8 GB SKU (MemTotal 7492 MiB); the 12 GB reference has 0x240000000 here.
dram_base = "0x8C0000000"            # high DRAM range 0x8C0000000-0xA0000000; the ADT writes /chosen/dram-base
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = true                  # native XNU panic output; Font.h is vendored in scripts/
# The pin below is the StaticTrustCache of the 25F84 image, so it does not belong to the 26C5035r one this
# board now declares. Commented out rather than carried: payload.py only applies the list to a trust cache
# passed with --trust-cache, so leaving the old value would reject the new image's cache while removing it
# accepts any. Neither is a decision this change can make without the image — re-derive it with
#   unixnu ipsw fetch -D . StaticTrustCache   # then sha256sum the member it extracts
# and put the digest back here.
# trust_cache_sha256 = [
#   "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
# ]
# The owner-built Metal addon (build-gpu-addon-blob.py, produced by the kernel
# archives above): payloads/kernel.macho.gpuaddon, placed by the DarwinBoot
# loader after the trust caches and staged into Data by kern_exec.c.
gpu_addon = "build/uke-gpu-addon/gpu-addon.z"
kernel_args = [
  "-v",
  "serial=3",
  # 0x14a = 0x14e minus DB_NMI (0x4). The rest is unchanged and inert on a board with no UART (DB_PRT
  # 0x2 / DB_KPRT 0x8 are serial output, DB_ARP 0x40 is arp debugging); the console text this board
  # actually reads comes from -v, -enable_kprintf_spam and -uketextconsole. DB_NMI is deliberately OFF
  # because it is the bit that makes a panic end in a spin instead of a reset, which is what keeps the
  # pram panic log from ever being readable:
  #   debug.c panic_init()  -> panicDebugging = TRUE when (debug_boot_arg & DB_NMI)
  #   debug.c Debugger()    -> if (PE_i_can_has_debugger(NULL) && panicDebugging) { ...; panic_spin_shmcon(); }
  #                            and the only path to the reset, `if (!panicDebugging) kdp_machine_reboot_type(...)`,
  #                            is skipped; PE_reboot_on_panic() also answers FALSE in that case.
  # A spinning kernel leaves the buffers only recoverable by a long press, and a power-off drops the DRAM
  # the log lives in. With DB_NMI clear the panic path flushes the region (paniclog_flush ->
  # PE_sync_panic_buffers) and then calls PEHaltRestart(kPEPanicRestartCPU). Note the remainder: that
  # reset goes through gIOPlatform, so a panic taken before an IOPlatformExpert exists still spins
  # (PEHaltRestartInternal returns -1) -- the stall probe and the lock watchdog cover that window.
  "debug=0x14a",
  # Round b170 (2026-11-13): the hand-rolled GIC path is switched OFF and the board is back on the
  # upstream interrupt path. Two facts forced this:
  #   * upstream's device records state it plainly - "Gunyah hypervisor: SGIs are not delivered, so
  #     IPIs use armcpu-spi-ipi=1" (UniXNU catalogue, device record for the same SoC class), and
  #   * the kernel now reaches this port's own uke_gic_arm_cpu() and dies there: the store to
  #     GICR_IGROUPR0 (PA 0x17190080) is refused by the bus (esr 0x96000010, DFSC 0x10) although the
  #     redistributor reports itself awake and this firmware's own ArmGicV3Dxe programmed the same
  #     frame earlier in the same boot.
  # ArmCpu (already a component of this board: UniXNU/ArmCpu, device-verified upstream) wakes the
  # redistributor, enables PPI 27 and routes IPIs over software-pended SPIs from its start(), i.e.
  # from a kext, once the kernel is up - which is the layer this port never reached before tonight.
  # uke-gic=0 keeps uke-gic-timer.patch compiled in but inert, so the comparison is one boot-arg away.
  "uke-gic=0",
  "armcpu-spi-ipi=1",
  # armcpu-probe=1 instead of armcpu-diagnostics=1: the instrumented ArmCpu copy in drivers/ArmCpu
  # prints every prepareGic step (mapGic / initDistributor / wakeRedistributor with its TYPER probe),
  # the IGROUPR0 and ISENABLER0 it read back, then DAIF/SRE/PMR/IGRPEN1/GICD_CTLR and the arch-timer
  # state, holds 15 s so the panel can be photographed, and panics on purpose so nothing scrolls it
  # away. 20 bytes against armcpu-diagnostics' 21, so the command line stays under the cap.
  "armcpu-probe=1",
  # Round B14 diagnostics: fileset-wait-log names every IOService a kext waits on, and
  # fileset-wait-cap-ms turns an unbounded wait into a 5 s one so the caller reports what it wanted
  # instead of hanging silently. Both are inert unless this kernel carries fileset-wait-probe.patch.
  # "fileset-wait-log=1",   (the wait names are now printed unconditionally by uke-aes-stub.patch)
  "uke-aes-stub=1",
  # "fileset-wait-cap-ms=5000",  (dropped for the 1000-byte cap: the probe now runs synchronously
  # at EARLY_BOOT and panics with its breadcrumbs, which is uke_usb_sync=1's whole purpose. The
  # fileset wait names print unconditionally from uke-aes-stub.patch, so the cap is redundant.)
  # DEVELOPMENT kernels keep kprintf off unless this is set; uke has no UART,
  # so kprintf then falls back to the framebuffer video console. Graphics boot
  # suppresses text until -uketextconsole switches the console to text mode.
  "-enable_kprintf_spam",
  "-uketextconsole",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # own-present (the gpu-framepresent v2/v3 verified set): presentBase resolves
  # the swap record's overlay surface after each SwapEnd and copies it to the
  # GOP. Without this the path is silent and the screen stays on the boot frame
  # (the 2026-10-27/28 frozen-screen runs never set it).
  # the screen console must not draw over presented frames; it is muted only
  # after the first successful copy, so logs survive until the UI takes over.
  "offline-legacy-noconsole=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  # Touch bring-up (docs/TOUCH-PORT.md on-screen set): stage 4 = firmware
  # download + frame loop; sheng-touch-hid=1 publishes digitizer reports
  # (required); poll mode is the device-proven frame path (the interrupt path
  # is not yet verified on hardware and falls back to polling by itself).
  "sheng-touch=4",
  "sheng-touch-hid=1",
  "sheng-touch-poll=1",
  "offline-legacy-phase=4",
  # GPU track (same values as gpu-framepresent v2/v3): the staged A732 bring-up
  # publishes the Metal device and the compositor submits the 1200-byte overlay
  # records whose layer 6 frame the own-present path resolves.
  "sheng-gpu-power=9",
  "sheng-gpu-metal=1",
  # GPU scanout hand-off (upstream GpuScanoutClient path): the addon plugin's
  # scanout client blits the offered frame into the scanout on the GPU; a
  # refused offer or failed copy falls back to the CPU copy (fail-safe).
  "sheng-fb-gpu=1",
  # DPU direct scanout: map the compositor's plain BGRA surface into the display bank's stage-1
  # window and flip VIG0/VIG1, instead of the 27 MB CPU copy per frame.
  "uke-dpu-scanout=3",
  # "sheng-gpu-pool=1536",   (parked for the 1000-byte command line: the GPU pool size only matters
  # once NativeAdreno runs. Restore when the boot reaches userland.)
  # The display refresh tick (upstream display port): 120 Hz vsync messages from the family's own sender, so the render
  # server paces to the panel instead of its 1/60 s heartbeat, and IOMFBDisplayRefresh reports the panel rate.
  # "sheng-vsync=120",   (parked to make room for uke-gic-diag=1 under the 1000-byte command-line
  # cap: the GPU only reaches a vsync consumer long after the point this round is measuring, and the
  # token costs 16 bytes. Restore it when the boot gets past the interrupt controller.)
  # stage the owner-built NativeAdrenoMetal bundle (addon blob) into Data so the
  # render server opens a native Metal device; iconservicesagent then keeps
  # CoreImage on that device instead of the null-GL crash loop.
  "sheng-gpu-addon=1",
  # Round B14 measures AppleImage4's waits, not the graphics stack: iconservices and the staged-app
  # copy sit past root mount, and the kernel command line is capped at 1000 bytes (it was 987 before
  # the two fileset-wait args below). Restore both once the kext stage is passed.
  # "sheng-iconservices=1",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  "native-ufs-root=1",
  "native-ufs-allow-unverified=1",
  "sheng-data-persist=2",
  # "sheng-staged-apps=1",   (see the note above: dropped for the 1000-byte command-line cap)
  # sheng-log=1 is OFF for this round, and it is the one variable changed. It is the switch for
  # package/UkeLastLog.c, whose writer is started from the first csr_check and whose transport
  # (package/UfsLogKernel.c) maps 0x01d84000+0x3000, programs the apps SMMU for stream 0x60, stops the
  # firmware's request list and sends one NOP OUT -- i.e. it touches the UFS controller very early,
  # before any kext has run. The stock kernel's own boot log shows what UFS needs first: RPMh rails and
  # the ref_clk, gcc_ufs_phy_gdsc, 8 GCC branches, TLMM pad 178 (UFS_RESET) released, the GIC ITS as
  # msi-parent and apps-SMMU stream 0x60. This board's firmware deliberately does not ship
  # UFSDxe/ClockDxe/RpmhDxe/SPMIDxe (uke.dsc), so none of that is done for us. If the ABL hands UFS
  # gated, that first access is a bus timeout -- a synchronous external abort, which is exactly the
  # shape of the panic this round is chasing. uke-serror-detail.patch reports esr/far/pc either way, so
  # this costs one boot and settles whether our own log channel is what stops the kernel.
  # "sheng-log=1",
  # The userdata copy of the message buffer (package/UkeLastLog.c, UKE_LOG_USERDATA): an absolute
  # first/last LBA of userdata on LUN 0, so the writer can open the last 32 MiB of it and append one
  # 16 KiB record every 2 s. Absolute, because the transport sends SCSI READ/WRITE(10) LBAs while the
  # recovery-side dd counts from the partition start.
  #
  # Where the two numbers come from. [userdata] above records the GPT entry (0x2d3000..0x38417fa) and
  # that record is stale: the live partition is 58,988,539 4K blocks of 225 GiB starting at 2,961,408,
  # so its last LBA is 2,961,408 + 58,988,539 - 1 = 61,949,946 and the 32 MiB window starts at
  # 61,941,755 -- which is the LBA the previous port's driver logged ("opens LBA61941755") and the
  # same 8192 blocks TWRP reads at skip=58980347 of /dev/block/sda32. The arithmetic is the check:
  # a stale end would move the window silently, which is why the start is passed too.
  #
  # Names, not sheng-log-*: the pram writer's sheng-log=1 is upstream's switch, these two belong to
  # the freestanding UFS writer in package/UfsLog.cpp. They are short on purpose -- the command line
  # is capped at 1000 bytes and 949 were already in use.
  "uke-log-first=2961408",
  "uke-log-last=61949946",
  # The old probe driver (package/uke_usb.c) is now inert, on purpose. Three of its switches would
  # each stop the boot before QcomXnuUsbDebug's worker runs: uke_usb_sync=1 panics inside its
  # STARTUP by design ("uke_usb_sync=1's whole purpose"), uke_usb_hook=1 reaches
  # uke_usb_probe_and_freeze(), and uke_usb=1 with no uke_usb_power writes the GDSC and all five USB
  # branch clocks - the same DWC3 the component owns. Its STARTUP still writes the UKEUSB-DISABLED
  # beacon into pram before returning, which is the one piece of evidence worth keeping.
  # uke_usb=0 alone disables the old probe driver (it returns before touching anything), so sync/hook/
  # panic are dropped rather than carried as zeros - the 1000-byte command line is full.
  "uke_usb=0",
  # OFF for this round. With it on, that component paints its OneSend QR card over the framebuffer and
  # repaints it every second (QcomXnuUsbDebug.c: fb_cycle, QCOM_USB_FB_TICKS_KEEP) to stay on top of the
  # console - and the card carries only ONESEND_BLOCK = 60 bytes of text per QR, cycled every 8 s, so a
  # log of a few KiB is dozens of QRs that no phone can sweep by hand. It hid the plain kernel text that
  # this round needs to read (b145's panel showed Image4/AMFI lines and was legible; b147's showed the QR
  # instead). The CDC-ACM log console it also enables was never read on this board - the logs we do read
  # are the firmware's, exported over USB-MSd, and the kernel's own panic record now goes to pram
  # (round b147) for the firmware to pick up.
  "qcom-usb-debug=0",
  # The panel now paints the request and a QR of it without panicking (STATE 82/84), so the diagnostic
  # panic stays off: with it on, the first control request stops the machine and enumeration can never
  # be tested. qcom-usb-panic=0 overrides the compiled-in default of 2.
  "qcom-usb-panic=0",
  "sheng-pmgr=2",
  "sheng-lite=1",
  "sheng-aks=1",
  # Documented diagnostic switch (unixnu.com/zh/xnu/boot-arguments): the security stage was the next
  # suspect after the nonce slot reads all failed, and this is the supported way to boot past it and see
  # what the next stage does. sheng-disable-watchdogd is dropped to stay inside the 1000-byte command line.
  "amfi_get_out_of_my_way=1",
  "sheng-smp=1",
  # uke-serror-resume=4 continues past an asynchronous platform error instead of stopping the boot,
  # after printing it and staging it into the pram panic header (uke-serror-detail.patch). Only the
  # asynchronous case is resumed: a synchronous external abort would re-execute the faulting load and
  # loop, and that one still panics with its esr/far/pc/ec. Four is a cap, not a target - a storm of
  # resumptions means the panic, not the resumption, is the answer.
  # Traded for armcpu-spi-ipi=1 to stay inside the 1000-byte command line (payload.py:38 enforces it):
  # ArmCpu's start() has never been reached on this board, so its SPI IPI switch is inert.
  # "uke-serror-resume=4",   (parked with uke-gic=0: this was the resume path for the synchronous
  # external aborts of the hand-rolled GIC setup, and those no longer happen. Costs 18 bytes.)
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # Contiguous hints off. Round b143 reached the early VM setup past kext loading and died in
  # arm_vm_page_granular_helper (pc 0xfffffff00bbe377c = +0x3fc, lr = +0x2cc, osfmk/arm64/arm_vm_init.c)
  # on
  #   assert(!kva_active || (ppte[i] == ARM_PTE_EMPTY) ||
  #          ((ppte[i] & ARM_PTE_HINT) == (ptmp & ARM_PTE_HINT)));
  # which is XNU refusing to change the contiguous bit on a mapping that is already active: the range was
  # first mapped with ARM_PTE_HINT and is now being updated without it (or the other way round). The hint
  # is a TLB optimisation -- 16 adjacent PTEs declared contiguously mappable -- and it assumes the block
  # is physically contiguous with identical attributes; the 4 KiB BCM2837 layout this port runs on is
  # exactly the case where that assumption stops holding. Disabling it makes both passes agree instead of
  # papering over the mismatch; it is parsed by PE_parse_boot_argn("use_contiguous_hint") in arm_vm_init.c,
  # so it costs one command-line argument and no kernel rebuild.
  "use_contiguous_hint=0",
  # Dropped for the 1000-byte command line (DarwinBoot's cap; 984 used, 16 free): io=0x10 is the IOKit
  # match diagnostic that proved "ArmCpu was never a candidate". Restore it by swapping with the line
  # above when driver matching is the question again -- the two are 22 and 8 bytes.
  # "io=0x10",
]
# Fixups of signed text, applied by the kernel after signature validation (patches/xnu/native-text-fixup.patch); they reach it as
# /chosen/text-fixups, not on the command line. Each is <file name>,<file offset>,<original>,<replacement>, in hex. uke runs the
# same 21H461 iPadOS build as sheng, so sheng's fixup list applies verbatim.
text_fixups = [
  # +[AWAttentionAwarenessConfiguration initialize] (21H461) only forces +[AWClientPreferences initialize] and deadlocks
  # SpringBoard startup against it (ABBA between the main thread and Siri's SASMyriadController); it returns at once instead.
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  # BTAudioHALPlugin's factory returns NULL, so audiomxd skips it: with bluetoothd disabled (sheng-lite) the plugin reconnects to the
  # audio device and hangs audiomxd's startup (int-141), which keeps the speaker from ever being ready.
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
# The kernel panic-log region: the 2 MiB tail of the 5 GiB high run, carved out of the managed window
# (dts/uke.dts memory@8c0000000 stops at 0x9FFE00000 for exactly this) so it is real DRAM that XNU's VM
# never allocates. devicetree.py writes TWO things from this one value, because XNU reads two things:
#   * a TOP-LEVEL `pram` node with `reg = <0x9FFE00000 0x200000>` -- check_for_panic_log() resolves it
#     with SecureDTLookupEntry(0, "pram") from the ROOT node (pexpert/gen/device_tree.c FindChild walks
#     direct children only), so the `/chosen/pram` this used to emit was never found at all and the
#     panel said "pram=0 size=0" every round;
#   * /chosen/embedded-panic-log-size = 0x200000, the length it maps and writes. It must be <= reg[1]
#     (native-dt-panic-region.patch returns early otherwise) and it is the ONE place that number may
#     live now: the [adt.chosen.u32] copy that said 0x380000 is gone, and devicetree.py refuses to
#     build if a board declares its own again.
# Round b158 removed this line and the kernel came back to life with a panel message, so something on the
# pram path killed it silently in b156. Two candidates share this one switch, and b159 separates them: the
# node is back (so XNU's own check_for_panic_log() maps the region as Apple intends), while the EARLY_BOOT
# snapshot in package/UkeLastLog.c - our own write, at a point where nothing is even printed yet - is gone.
panic_region = "0xFF800000:0x380000"
tool = "scripts/make-uke-adt.py"
chip_id = "207"
owned_memory_size = "0x100000000"     # 4 GiB of this unit's 5 GiB high run (0x8C0000000..0xA0000000).
                                      # Ladder if DarwinBoot reports Out of Resources or the VM misbehaves:
                                      # 0xC0000000 (3 GiB) -> 0x80000000 (2 GiB). 12 GB reference used 4.75 GiB.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# mount(8) phase 1 requires a boot manifest hash to name /private/preboot/<hash>.
# uke has no Apple personalization manifest, so this is an explicit bring-up
# owner boot-set identity (SHA-384 of "UkeBringup.BootSet.v1\0"), not Apple data.
boot_manifest_hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
persistent_data = true               # sheng-data-persist keeps Data writes, so Data is not ephemeral storage
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; [bootimg.image] would override them.

# The stock ABL powers the panel off when the device tree has no splash region, so add it.
[bootimg.image]
header_version = 4
base           = 0x00000000
kernel_offset  = 0x00008000
tags_offset    = 0x01e00000
pagesize       = 4096

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

# The boot image has no ramdisk. The payload is the vendor_boot vendor ramdisk,
# which the ABL loads at 0x1000000; UkeBootMemoryDxe publishes this range as
# the FAT volume the boot manager scans.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = ["0x1000000"] },
  { name = "linux,initrd-end", type = "x", value = ["0x6000000"] },
]

[device_tree]
source = "device:dts/uke.dts"
include_dirs = ["soc:dts"]

# Board ADT overrides on top of the OS profile identity (the make-uke-adt.py
# baseline). The GMU pool rides as a top-level node; the panic log's top-level
# `pram` node is generated from [payload.adt] panic_region, not from here.
[adt.chosen.u32]
# `embedded-panic-log-size` deliberately absent: panic_region writes it, and
# SecureDTGetProperty returns the FIRST property of a name, so a copy here wins
# over the one that matches pram.reg -- which is how 0x380000 (the old
# 0xFF800000/llcc_lpi size) came to describe a 0x200000 region and made
# check_for_panic_log() bail out. devicetree.py now refuses the combination.
# SecureBootModel=Disabled, in the only form XNU reads it. AppleImage4 asks the security state whether this
# is a production device before it reads a nonce slot; on this board there is no such slot, so it reports
# "failed to read nonce slot data: 2" for every magazine and then waits. Production status 0 with security
# mode 1 is development/permissive: the same four values the community's working QEMU reference ADT sets
# for --ipad-identity, and the same ones an OpenCore config expresses as SecureBootModel=Disabled.
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
# Apple's own Mac17,2 device tree (decoded to work/analysis/ref/mac17g.adt) carries the rest of this set,
# which Image4 consults before it reads a nonce slot: the AP-side security mode, downgradability and the
# nonce-retrieval permission. uke declared four of them and no nonce at all, which is why every magazine
# reports "failed to read nonce slot data".
effective-security-mode-ap = 1
security-downgradable = 1
allow-ap-nonce-retrieval = 1
image4-allow-magazine-updates = 1
secure-boot = 0

[adt.chosen.string]
# Apple's own Mac17,2 device tree carries this in /chosen, next to the security-mode keys, and the value
# is "sha2-384". Nothing on this board provided it, and the kernel panics with
#   panic: non-sensical crypto hash method
# from Apple's nonce path (the collection's strings put it next to
# IOReturn AppleMobileApNonce::_retrieveNonce), which is also why every magazine reports that it cannot
# read a nonce slot: without the hash method the slot contents cannot be interpreted at all.
crypto-hash-method = "sha2-384"

[adt.chosen.bytes]
# The boot nonce itself. On Apple silicon iBoot writes it into /chosen and Image4 reads it back through
# the magazine path; nothing on this board produces one, so the slot read fails for every magazine.
boot-nonce = "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
boot-manifest-hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"

# /chosen/machine-timeouts: XNU's own watchdog for "preemption was disabled too long". Round b142 tripped
# it and died at
#   Preemption disable timeout exceeded: 141.579 ms >= 6.250 ms (start: 993638512, end: 996356831)
# before printing anything else worth reading. Two things make that trip uninformative here rather than
# decisive:
#   * the skip predicate (kprintf_spam_mt_pred, osfmk/arm/preemption_disable.c:459) treats "no serial
#     output" as "kprintf spam is off", so on a board with no UART the watchdog stays armed even though
#     the text console is the only way out of this kernel, and
#   * a 141 ms window is the kext-load/security-policy stall this board is already known to sit in
#     (AppleImage4 waits for a nonce slot that does not exist; see the security keys above), not a
#     separate fault: the watchdog fires inside the wait it is supposed to diagnose.
# OFF, not traced. TRACE (1) was tried first and is worse: it keeps the measurement, and the measurement
# itself is what round b144 died on. With the mode non-zero, the first 0->1 preemption disable calls
# _prepare_preemption_disable_measurement() (osfmk/arm/preemption_disable.c:325), which unconditionally
# calls ml_set_interrupts_enabled_with_debug(false) -- a call that asserts the hardware was fully
# UNmasked -- and on this board the first preemption disable happens with I and F already masked:
#   machine_routines_common.c:1128 Assertion failed: state & DAIF_STANDARD_DISABLE == 0
#   (0xc0 == 0x0, 192 == 0) at pc _ml_set_interrupts_enabled_with_debug+0x1e8,
#   lr __prepare_preemption_disable_measurement+0x44
# So both hygiene symptoms this board has produced -- the 141 ms timeout of b142 and this assertion --
# come from the same optional instrumentation. OFF (0) removes the measurement path, which is the only
# thing that reaches that assertion from here.
#
# OPEN, and worth answering rather than forgetting: XNU expects the first preemption disable to happen
# with interrupts enabled. On this board it happens with them masked, which is legal but not Apple's
# boot order -- either early init disables preemption before ml_set_interrupts_enabled(TRUE) is reached,
# or the loader hands off with DAIF masked where iBoot would not. Once that is understood, SCHED_HYGIENE
# can be turned back on (mode 2) and the timeout becomes a useful tripwire again instead of a wall.
[adt.chosen.machine-timeouts.u32]
sched-preemption-disable-mode = 0

[adt.defaults.u32]
sleep-disabled = 1
# AppleImage4 matches on /defaults, not /chosen (see the evb10 device record), so the security state it
# consults before reading a nonce slot has to be here. Values as in the community's working QEMU reference.
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
"kern.maxvnodes" = 0x13400

[adt.product.string]
model = "xiaomi,uke"

[adt.product.u32]
thin-bezel = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# The panic log's top-level `pram` node is NOT configured here: [payload.adt] panic_region writes it
# (devicetree.py) and [adt.pram] is refused, so there is one number pair and not two.
#
# Round B26b (2026-11-04) had it here, as
#   # [adt.pram.bytes]
#   # reg = "000080ff000000000000380000000000"      # 0xFF800000, 0x380000
# and disabled it again: publishing it hung the boot before the kernel printed a single line, with the
# panel left on the loader's hand-off frame. 0xFF800000 is not DRAM to hand to an OS -- it is the
# llcc_lpi_region reservation of the UEFI memory map (MemoryMapLib.c: {"llcc_lpi_region@ff800000",
# 0xFF800000, 0x00380000, AddMem, MEM_RES, UNCACHEABLE, ...}) -- and PE_create_console() maps and
# bzeroes the region before the video console exists, so a fault or a stall there is completely silent.
# The region in use now, 0x9FFE00000, is the tail of the managed DRAM run instead. What that old attempt
# proves is that this code path can stop the boot, not that this address does: the panel line
# "PREVIOUS XNU LOG (pram=0 size=0)" is the evidence that the node was never found at all since.
#
# gmu-memory is inert until the GPU stage adopts the pool, so it goes with the ADT above to keep the
# shipped ADT byte-for-byte the one that booted.
# [adt.gmu-memory.bytes]
# reg = "000000c8000000000000000200000000"
