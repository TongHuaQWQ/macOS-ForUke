# Board description of the Xiaomi Pad 7 (uke, SM7675), read by the unixnu build driver.
schema_version = 2

[board]
name = "uke"
soc = "SM7675"
soc_source = "sm7675"
os_profile = "macos-27.3-uke"    # thin macOS 27.3 profile: upstream 26C5035r identity + its 53-patch
                                  # xnu-12377 series, none of the sheng board's [adt]/[root]/[userdata]
description = "Xiaomi Pad 7"
kit = "uke"                      # the package/ of this repository appears as kits/uke in the build tree

# The packaging half of the board (docs/porting/packaging.md): scripts/package.sh is the UniXNU
# repository's templates/package.sh copied unchanged, and it reads exactly one board value here — the
# path of the driver. Everything else the run needs comes from the sections below and the profile.
[package]
# The UniXNU checkout beside this repository. Both layouts this board is built in are siblings: the
# workspace (work/push/macOS-ForUke + work/push/UniXNU) and .github/workflows/package.yml, which
# checks the device repository out as `device/` and the core as `UniXNU/` next to it.
unixnu = "../UniXNU"
# The `boot` partition of this unit, from `fastboot getvar all` (docs/STATE.md §18: boot_a/b and
# vendor_boot_a/b are 0x6000000 each, 96 MiB). verify refuses a larger boot.img; the shim + firmware
# volume + device tree + payload ramdisk of this board are many times smaller, so this is the device's
# limit and not a budget the build spends.
boot_partition_bytes = 0x6000000

# The configuration each OS profile packages. "unixnu release" always selects through this table, so a
# profile named here never depends on the out/ state of the machine that runs it.
[package.defconfig]
# macos-27.3-uke — profiles/os/macos-27.3-uke, this board's own thin 26C5035r identity: the macOS
# prelink track. configs/uke-macos_defconfig sets CONFIG_XNU_BUILD_ARCHIVES=y, which is what makes the
# kernel step build the archives the prelink reads.
"macos-27.3-uke" = "uke-macos_defconfig"
# macos-27.3-26C5035r — upstream's own 27.3 profile, the identity [ipsw] declares (Mac17,11 / k114cap /
# 26C5035r): the baseline configuration, the same one [kernel] defconfig names. It builds a boot-test
# kernel without the archive chain, exactly as the CI round builds it beside the prelink candidate.
"macos-27.3-26C5035r" = "uke_defconfig"

# The full component selection; the resolver adds dependencies and orders their recipes.
[components]
include = [
  "ArmDTPlatform", "ArmCpu", "ArmVirtPlatform",
  # ShengUfs is back: the profile's signed root policy it needed exists now (scripts/policies/26C5035r),
  # and its [kernel] archives entry below returns with it. archive_plan() requires that entry for every
  # selected kernel-stage component, so the two lines move together.
  "ShengUfs",
  # ShengHidInput is absent for a different reason than ShengUfs ever was: build-sheng-hid-input.py
  # refuses any
  # target except arm64 iOS 17 ("The original HID ABI builder only supports arm64 iOS 17"), and its
  # suggested replacement, build-sheng-source-drivers.py, is a compile audit whose output still needs
  # target-family linking. The menu counts down and boots without an input device, so a prelink round
  # does not need the touch driver.
  "SoftwareAES", "ShengNovatekTouch", "AppleKeyStoreState",
  "RamBlock", "VirtioMmioBlock", "VirtioMmioConsole",
  # GPU is its own track: its kernel-side components need the A732 firmware pins
  # (.cache/firmware/uke-gpu) and the owner-built Metal plug-in, which a public runner cannot produce,
  # and kernel.py:archive_plan requires every selected component with a kernel build recipe to appear
  # in [kernel] archives. Restore these three lines together with the GPU archive entries.
  # "Adreno740", "AdrenoMetal",
  # QcaBluetooth and QcomDwc3 are materialized through feeds.toml local overrides (drivers/QcaBluetooth,
  # drivers/QcomDwc3) and compiled by scripts/build-qca-bluetooth.py and scripts/build-qcom-dwc3.py,
  # keeping compatibility with older local UniXNU catalogs whose components.toml predates them.
  "GopFramebuffer", "QcomGeniSpi",
  "XnuPrelink", "DarwinBoot", "VerifiedRoot", "AirNir", "AdrenoPM4", "AdrenoFirmware", "ArmSmmu4K",
]

# The target OS image: the macOS 27.3 universal restore image (it replaced the iPad7,1 iPadOS 17.7.11 image
# this board was first ported against, and then the macOS 26.5.2 one). Give --ipsw PATH to use a local file;
# without it the remote url is read with range requests, only the members that are needed.
[ipsw]
# macOS 27.3 (26C5035r) universal restore image — upstream's, the one profiles/os/macos-27.3-uke declares.
# One IPSW serves 50+ boards, so the identity is picked by the four fields below; every kernelcache and
# system volume is one of its BuildManifest entries.
#
# `fetch` is deliberately NOT overridden here: entries are BuildManifest COMPONENT names, and the path
# is resolved through Manifest[component].Info.Path. A file name such as kernelcache.release.mac17j is
# not a component and fails with "component ... is not in this IPSW". The OS profile asks for
# KernelCache, DeviceTree, StaticTrustCache, Cryptex1,SystemTrustCache and — new in 27.3 —
# Cryptex1,AppTrustCache; the identity below (k114cap, Mac17,11, ApChipID 0x6050, ApBoardID 0x04) is the
# identity upstream's 27.3 profile prelinks, kernelcache.release.mac17j.
#
# Nothing here is re-verified against the 26C5035r BuildManifest: this tree holds no such image, and the
# 1527-member count above was measured on the 25F84 one. Before the first build, fetch the cache and read
# the resolved member name:
#   unixnu ipsw fetch -D . KernelCache DeviceTree
# and check that Cryptex1,AppTrustCache exists in the 27.3 manifest (it does not exist in 25F84's
# component list as far as this repository can tell), because a missing component fails the same call.
url = "https://updates.cdn-apple.com/2026FallSeed/53df7654-4865-4259-8dae-30177b76f104/UniversalMac_27.3_26C5035r_Restore.ipsw"
product = "Mac17,11"
version = "27.3"
build = "26C5035r"
device_class = "k114cap"
chip_id = 24656                      # 0x6050 — the identity upstream's 27.3 profile names for Mac17,11
board_id = 4

[ipsw.sha256]
# Pinned 2026-11-15 from the 26C5035r members actually fetched into
# work/push/UniXNU/out/ipsw/26C5035r/ - every value below is copied programmatically from that member's
# own recording .json, not retyped. They are checked at fetch time (unixnu/ipsw.py: `pin =
# config['sha256'][Path(name).name]`), so re-fetching a different member now fails loudly instead of
# silently building against another image.
"141-22233-021.dmg.aea" = "b7dbb5c6c3ee18ba43fcccb2e865aee008e4388f634bcfbd611b93bf9907d434"  # OS, 11408506880 B
"141-22145-021.dmg.aea" = "00f80636bede8b709d0f6342ebefef3ec25ac43b3db03e544f4ccf692ada736d"  # Cryptex1,SystemOS, 2483027968 B
"141-22106-021.dmg" = "797bb1e07e354e80e75d3be2658d8f586b343dbdc05cb93cb880e772ab0d23d1"  # Cryptex1,AppOS, 54525952 B
"141-22233-021.dmg.aea.trustcache" = "6bc49e0dffade1c61401fd3e087636627f1ae7eca26df9b8890b1cb78ffb2963"  # StaticTrustCache, 445681 B
"141-22145-021.dmg.aea.trustcache" = "613d7972025f35c9b22993032fb4643fc7d9df9253778d6cd0734af9a19dff99"  # Cryptex1,SystemTrustCache, 3503 B
"141-22106-021.dmg.trustcache" = "ec5028bf90a6341a267f37356573a007fdbb9b5a2574eb9eae019715b589523c"  # Cryptex1,AppTrustCache, 2135 B

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# first_lba and last_lba are the GPT entry "userdata" of LUN 0, read from the tablet.
[userdata]
first_lba = 0x2d3000
last_lba = 0x38417fa             # this unit: 58,988,539 x 4096 B = 225.0 GiB (12 GB reference: 0x3b147fa)
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
  # App cryptex added 2026-11-15: the macOS boot checkpoints require the OS *and* App cryptex views under
  # /System/Volumes/Preboot/Cryptexes, and the 26C5035r image does carry the member - verified in
  # work/push/UniXNU/out/ipsw/26C5035r/141-22106-021.dmg.json ("component": "Cryptex1,AppOS", 54,525,952 B,
  # sha256 797bb1e0...23d1), with its trust cache 141-22106-021.dmg.trustcache (Cryptex1,AppTrustCache).
  # unixnu/userdata.py skips a window whose component is missing from the image, so this is safe on an
  # image that lacks it; on this image it is present and will be included.
  { name = "App", component = "Cryptex1,AppOS" },
]
# Data objects (SHNGROOT version 2, block_size 4096, flags 3): the kernel reads them itself and never
# publishes them as block devices. These are the block hash tables of the three root policies in [root],
# 130 MiB together, which cannot ride in the 96 MiB boot image. NativeUfs opens each as "<window>.vroot"
# and checks it against that window's signed 544-byte header.
#
# They live in THIS repository under scripts/policies/26C5035r/<NAME>/hashes.bin, and only the tables are
# untracked: build-sheng-source-storage.py says the signed headers ship in the checkout while "the full
# block tables stay a local input of the userdata image". So the three *headers*, three anchors and three
# verification records (4,349 B) are added with `git add -f` because .gitignore drops *.bin, while the
# tables stay local and are produced once by scripts/make-root-policies.py on macOS:
#   TREE/build/verified-root-<NAME>/hashes.bin   the table     -> this directory
#   TREE/scripts/policies/<build>/<NAME>/        header, anchor, verification record
# {tree} below is the build tree, and scripts/unixnu/tree.py merges this repository's scripts/ into it
# (tree.py:85-92), which is how the staged tree finds these files. A CI kernel build needs only the
# 4,349 B of headers; a local `unixnu userdata` additionally needs the tables, or it stops with MISSING.
# scripts/unixnu/test_userdata.py covers the declaration, the 1 MiB placement and the refusals.
objects = [
  { name = "OS.vroot", path = "{tree}/scripts/policies/26C5035r/OS/hashes.bin" },
  { name = "SystemOS.vroot", path = "{tree}/scripts/policies/26C5035r/SystemOS/hashes.bin" },
  { name = "App.vroot", path = "{tree}/scripts/policies/26C5035r/App/hashes.bin" },
]

[root]
# The signed root windows: the APFS volume UUIDs and image digests the owner-root path binds, and the
# inputs of scripts/make-root-policies.py. They belong in the board, not in profiles/os/macos-27.3-uke:
# scripts/unixnu/kernel.py:58 reads ctx.board['root'] (never the OS profile) and maps these six keys to
# XNU_OWNER_ROOT_VOLUME_UUID / _CACHE_VOLUME_UUID / _APP_VOLUME_UUID and UNIXNU_ROOT_*_SHA256, and
# build-xnu-4k-baseline.sh:489 hard-fails CONFIG_XNU_OWNER_BOOT_MANIFEST without the root volume UUID.
#
# The values are properties of Apple's signed 26C5035r disk images rather than of this board, so they are
# taken verbatim from upstream profiles/os/macos-27.3-26C5035r/profile.toml [root] — and every one of the
# three digests is confirmed against the image actually on disk in out/ipsw/26C5035r/:
#   OS        141-22233-021.dmg  14,493,417,472 B  -> the upstream os_image_sha256
#   SystemOS  141-22145-021.dmg   2,917,138,432 B  -> the upstream systemos_image_sha256
#   App       141-22106-021.dmg      54,525,952 B  -> the upstream app_image_sha256
# (all three after AEA decryption, per their .dmg.json records). Same images, same signatures: the policies
# this board signs describe exactly the volumes it installs.
# The Data volume UUID is the exception — it is this port's own seed, and it lives in the defconfig as
# CONFIG_XNU_OWNER_DATA_VOLUME_UUID (BB2462E2-...), see [payload.runtime] below.
os_volume_uuid = "84581E99-85BE-4957-AC53-2947E887B3E4"
os_image_sha256 = "40d8282eb8650da9b4d7437a981764c48d47ee4bdc5b8b362248f25ecbce0e70"
systemos_volume_uuid = "6678E466-2F88-4C56-9408-DC7361BAA0BA"
systemos_image_sha256 = "14330ed990fe7022114b10718f4defe3049d49b6e5d52fd3ac71a487541cd1f3"
app_volume_uuid = "F2AEA010-C8EB-4AF8-92A9-4B90781CD668"
app_image_sha256 = "797bb1e07e354e80e75d3be2658d8f586b343dbdc05cb93cb880e772ab0d23d1"
# The signed block hash tables do NOT fit in the boot image on this unit, so they travel in the userdata
# image instead and the kernel bundle carries only the 544-byte signed header of each policy. Measured,
# not estimated: 32 bytes per 4096-byte block over the actual images
#   OS        3,538,432 blocks -> 113,229,824 B (108.0 MiB)
#   SystemOS    712,192 blocks ->  22,790,144 B ( 21.7 MiB)
#   App          13,312 blocks ->     425,984 B (  0.4 MiB)
# against boot_partition_bytes = 0x6000000 (96 MiB) for boot and vendor_boot alike, with the payload
# already at 80 MiB. The OS table alone is larger than the whole partition. This is what makes
# [userdata] objects below mandatory rather than optional: kernel.py maps this key to
# XNU_SOURCE_STORAGE_TABLES=userdata, build-sheng-source-storage.py then emits header-only bundles, and
# NativeUfs reads "<window>.vroot" from the root image (build-sheng-source-storage.py: "NativeUfs reads
# <window>.vroot from the root image and vr_open checks it against the header").
tables_in_userdata = true

[payload.runtime]
# SHAPE copied from the reference sheng board (work/ref-sheng/board.toml [payload.runtime]).
#
# Everything this block needs now EXISTS and has been exercised on this host (2026-11-15):
#   * first-install Data seed: out/uke/macos-27.3-uke/uke-macos/runtime/data.dbr
#       22,614,176 B packed, 210 GiB container, encoded_sha256 a43d3ee0...80924,
#       volume UUID BB2462E2-040E-4F82-9C69-CACB7A872551
#       (made on an x86 Hackintosh from the decrypted OS image: sudo python3
#        scripts/make-macos-data-seed.py <OS dmg> data.dbr --gib 210)
#   * owner trust bundle: runtime/owner-trust.bundle (451,264 B), built HERE on Linux from the three
#       trust-cache components - build-boot-runtime.py needs no macOS for that.
#
# enabled = false on purpose, for exactly one reason: runtime.py:110 compares the seed's volume UUID with
# CONFIG_XNU_OWNER_DATA_VOLUME_UUID of the *compiled* kernel, and this kernel predates the owner-Data path
# (configs/uke-macos_defconfig keeps CONFIG_XNU_OWNER_DATA_MOUNT / _OWNER_ROOT_TRUST / _VERIFIED_ROOT_PROBE
# / _OWNER_UNION_SYSTEMOS off). With enabled=true, every `unixnu payload`/`bootimg` stops with
# "Data seed UUID differs from the compiled configuration" - which would block the device-side loop.
#
# To flip it: put CONFIG_XNU_OWNER_DATA_VOLUME_UUID="BB2462E2-040E-4F82-9C69-CACB7A872551" in the defconfig
# (exactly once - runtime.py:118 demands one match), enable the owner-root configs, rebuild the kernel in
# CI, then set enabled = true here.
tool = "scripts/build-boot-runtime.py"
target = "macos27"
build = "26C5035r"
data_gib = 210
skip_setup = false
gpu_addon = false
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]
bluetooth_tool = "scripts/build-bluetooth-userspace.py"
bluetooth_target = "macos27"
enabled = false

[kernel]
defconfig = "uke_defconfig"
# Declared explicitly: the iOS chain uses the arch profile's four-layer default, but a macOS guest
# drops the soc layer (see the note below) and carries what it still needs in this repository.
# No soc layer: UniXNU-sm7675-common's soc series targets xnu-10063; its one still-needed hunk
# (the MPIDR core numbering) lives in patches/xnu/native-smp-secondary-bcm2837.patch.
patch_series = ["arch:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# The four-layer series of the resolver: shared arch patches, the SoC platform
# patches, the OS patches and the board's own. Empty fragments: the board's
# defconfigs carry the full configuration.
config_fragments = []
# Archive builders of the kernel step, in order. They run only for a configuration with
# CONFIG_XNU_BUILD_ARCHIVES=y (configs/uke-full_defconfig), after the bootstrap pass has left the
# compile records behind. component: entries are catalog recipes; the rest are scripts of the
# build tree with their arguments.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:ArmVirtPlatform",
  "component:SoftwareAES",
  # The overlay below is now the measured mac17g layout (native-aes-original-bindings.S was
  # rewritten from mac17g's own symbol table), so the step can run again.
  "build-software-aes-bindings.py",
  # The source storage runtime creates the accelerator through native_software_aes_create() and runs its
  # static initializer by name; neither symbol exists in the archive the two steps above build (the
  # initializer is emitted local, the factory is only ever generated). Allenwdk/UniXNU-uke does the same
  # two steps inside build-software-aes-27.py. Without them the link stops on
  # "__GLOBAL__sub_I_NativeAES.cpp" / "native_software_aes_create" from SourceStorage.o.
  "build-software-aes-factory.py",
  # WITHOUT build-software-aes-bindings.py. The overlay it compiles is in the core checkout
  # (scripts/data/native-aes-original-bindings.S), so the step itself would run — but its `.set`
  # values are the measured iPadOS 17.7.11 prelink layout of IOAESAccelerator (0xfffffff004a8…), and
  # prelink-ABI addresses do not carry across kernelcaches (same argument as build-sheng-platform-power.py
  # below). With the step absent, libSoftwareAES.a(NativeAES.o) imported createSpecialKeys,
  # performAESQuantum, completeAESQuantum, disableHardwareKey, performImmediateAES, the base
  # constructor and the destructor with nothing to define them, and run 41387605078 died at the link.
  # CONFIG_XNU_NATIVE_AES is off in configs/uke-macos_defconfig for this round, which keeps that
  # archive out of the link entirely. Reinstating both needs an audit of mac17g's own collection (the
  # extent emit_prelink.py plans for com.apple.iokit.IOCryptoAcceleratorFamily), not a re-pinned
  # address set.
  "prepare-storage-headers.py",
  # Storage is back (2026-11-15): the policy directory it was waiting for now exists
  # (scripts/policies/26C5035r, signed on the x86 Mac from this board's own images), so on arm64e the
  # component takes its authenticated branch — build-sheng-source-storage.py with header-only bundles,
  # the tables arriving as the [userdata] objects "<window>.vroot". This is the only UFS entry that
  # returns: build-arm-driver.py NativeUfs --unverified stays out, because that classic driver was
  # written against the iPadOS 17 IOStorageFamily headers and does not compile against the 26-train
  # headers prepare-storage-headers.py prepares. configs/uke-macos_defconfig therefore sets
  # CONFIG_XNU_NATIVE_UFS and, for the same round, native-ufs-root=1 in kernel_args finally points at a
  # driver that is in the kernel.
  "component:ShengUfs",
  # The source runtime itself, the way the official boards run it: UniXNU-sheng's [kernel] archives name
  # "build-sheng-source-storage.py --policy-dir scripts/policies/<profile>" directly after
  # component:ShengUfs — "so the source storage archive and root-policies.bin the defconfigs link no
  # longer depend on a leftover of an earlier build" (unixnu.com/zh/devices/sheng#arm64e-os). Without
  # the entry the adapter still runs, because build-arm-driver.py delegates to it on arm64e, but that
  # fallback passes no --policy-dir and leaves the order implicit. The archive it writes is
  # {tree}/build/sheng-source-storage/libShengSourceStorage.a, which CONFIG_XNU_EXTRA_LD_ARCHIVES
  # force-loads — the same wiring Allenwdk/UniXNU-uke uses on this device.
  "build-sheng-source-storage.py --policy-dir scripts/policies/26C5035r",
  # WITHOUT build-arm-driver.py NativeUfs --unverified: the classic driver above, superseded.
  # WITHOUT build-ufs-original-bindings.py: it binds IOBlockStorageDevice from a *prelinked* candidate
  # and insists the plan's original_sha256 equals kernelcache.release.ipad7 (f18b4df8… in the script),
  # so on this port it fails twice over — the provenance is the iPadOS 17 image, and the candidate this
  # workflow stages comes from a --skip-prelink build whose JSON carries no prelink plan at all.
  # The source runtime carries its own bindings; nothing here asks for the unverified ones any more.
  "component:RamBlock",
  "component:VirtioMmioBlock",
  "component:VirtioMmioConsole",
  "build-mockfs-fixture.py",
  # WITHOUT build-sheng-platform-power.py: it inherits ApplePMGR AON slot addresses from a recorded
  # audit and refuses any kernelcache other than kernelcache.release.ipad7 (same f18b4df8…) —
  # "Recorded bindings are for another kernelcache". Those addresses are prelink-ABI values that do not
  # carry across kernelcaches, so re-pinning the hash would bind the wrong ones. CONFIG_XNU_SHENG_PMGR
  # stays on, and its call site (zzz-boot-progress.patch) is not in this arch series, so the define is
  # inert here and nothing needs the archive to link.
  # "build-sheng-platform-power.py",
  "build-libpthread-kernel.py",
  # "component:ShengHidInput",
  "component:AppleKeyStoreState",
  # --- not runnable on a public runner; re-enable when the inputs exist -------------------------
  # Kept visible instead of deleted so the full build's shape stays readable.
  #
  #   prepare-uke-gmu.py / component:Adreno740 / build-native-adreno-kits.py /
  #   build-adreno740-accelerator.py
  #       need the A732 GPU firmware pins in .cache/firmware/uke-gpu (extracted from the device's
  #       /vendor/firmware_mnt/image and /odm/firmware — see proprietary-files.txt).
  #   build-native-legacy-display.py
  #       gated by audit-mobile-graphics-legacy.py against a previously qualified candidate.
  #   build-gpu-addon-blob.py
  #       packs the owner-built Metal plug-in bundle, which no clean tree has.
  #
  # "prepare-uke-gmu.py",
  # "component:Adreno740",
  # "build-native-adreno-kits.py",
  # "build-adreno740-accelerator.py",
  # "build-native-legacy-display.py",
  # "build-gpu-addon-blob.py",
  # build-boot-log.py compiles package/{UkeLastLog,BootWatchdogPolicy,CrashLogProbe}.c with this
  # kernel's own ABI. UkeLastLog is what puts a msgbuf snapshot into the pram window every 500 ms
  # (sheng-log=1 in kernel_args), and the UEFI side (ukePkg/Drivers/UkeUsbLogDxe) copies that window
  # into a RAM disk it serves over USB, which is how a kernel log becomes readable without a
  # photograph. The other two are inert here (XNU_WATCHDOG_POLICY and CONFIG_XNU_BOOT_PROGRESS are
  # off) but they are what the device series calls into, so keep them compiling.
  "build-boot-log.py",
  # The CDC-ACM log console over DWC3 (package/uke_usb.c, ported from the sirius port). Its object
  # joins libUkeLastLog.a, so this must come after build-boot-log.py.
  "build-uke-usb.py",
  # libQcomXnuUsbDebug.a (package/qcom-usb-debug), built against this tree's own compile records with
  # soc/Uke.h. The kernel links it when CONFIG_XNU_QCOM_USB_DEBUG is on, which it now is.
  "build-qcom-usb-debug.py",
  # libQcomDwc3.a (drivers/QcomDwc3 + package/UsbProbe.cpp): the official route. The script generates the
  # two base classes from scripts/usb-{xdci,xhci}-26C5035r.json, compiles the driver against them, reads the
  # compiled vtables back entry by entry to prove each one authenticates with the original slot's
  # diversity, and emits the branch stubs that bind them to the prelinked collection's own code.
  # configs/uke-macos_defconfig force-loads the archive; `usb=1` decides at boot whether it runs.
  "build-qcom-dwc3.py",
  # libQcaBluetooth.a (drivers/QcaBluetooth + SM7675 UART10 + WCN6750 WcnPower + BluetoothProbe):
  # upstream QcaBluetooth extended with WCN6750 (3 Mbaud, msbtfw12/msnv12) and macOS 27.3 /dev/cu.BLTH
  # (qbt_tty.c). BluetoothFirmware.c is compiled by build-sheng-source-storage.py into libShengUfs.a
  # (matching upstream sheng). configs/uke-macos_defconfig force-loads libQcaBluetooth.a; `bluetooth=1`
  # enables the worker thread at boot.
  "build-qca-bluetooth.py",
  # libUkeUfsLog.a (package/UfsLog.cpp + package/UfsLogKernel.c): the freestanding UFS transport that
  # gives UkeLastLog.c's userdata half its native_ufs_log_* symbols without CONFIG_XNU_NATIVE_UFS.
  # configs/uke-macos_defconfig force-loads it through CONFIG_XNU_EXTRA_LD_ARCHIVES, so a configuration
  # with CONFIG_XNU_LOG_USERDATA=y links it and one without builds it and links nothing.
  "build-ufs-log.py",
  # The comparison kernel the fileset prelink reads, last, as upstream's 26/27 archives do:
  #   "The 27 kernel archives end with build-fileset-release-reference.py --tree ., the comparison
  #    kernel the prelink step reads." (docs/devices/sheng.md)
  # It asserts the four archives above it (corecrypto both flavours, ArmDTPlatform, ArmCpu, libpthread),
  # so the position matters. It runs only for a configuration with CONFIG_XNU_BUILD_ARCHIVES=y; the
  # workflow builds it explicitly for uke-nodisplay_defconfig, which has no archives.
  # --lto (round-b2): the native kernel is LTO now and the matcher's `pac-checked-shape` anchors went
  # 113 -> 1,059 while `reference-order` stayed flat at ~4,39x -- because this comparison kernel was
  # still the non-LTO snapshot. Its earlier --lto attempt died before linking and the reason was
  # invisible; the builder now prints it and the artifact carries fileset-reference/*.log, so retry
  # with the diagnostics in place (docs/11 §38).
  "build-fileset-release-reference.py --tree . --lto",
]

# Adreno 732 (uke) board values for the native GPU driver. The driver carries
# an A740 and an A732 profile; scripts/check-uke-gpu.py compares these values
# with a device DT dump, and scripts/prepare-uke-gmu.py turns the recorded DT
# facts into the headers NativeAdreno consumes. The catalog values are from
# MCC45TR/senemos-uke-kernel-mainline patch 0036 (public A732 entry), not a
# device run.
[gpu]
model = "Adreno732"
chip_id = "0x43030b00"
compatible = "qcom,adreno-gpu-gen7-11-0"
family = "ADRENO_7XX_GEN2"
gpu_base = "0x3d00000"
gpu_size = "0x40000"
gmu_base = "0x3d68000"
gmu_size = "0x37000"
gmu_pdc_base = "0xb280000"
gmu_pdc_size = "0x10000"
gpucc_base = "0x3d90000"          # qcom,cliffs-gpucc
gpucc_size = "0xa000"
gcc_base = "0x100000"             # qcom,cliffs-gcc
smmu_base = "0x3da0000"
smmu_size = "0x40000"
sid_user = 0x00
sid_secure = 0x02
sid_gmu = 0x05
gmem_bytes = "0x180000"           # 1.5 MiB
gmu_chip_id = "0x70b0000"         # a6xx_info.gmu_chipid for 0x43030b00
gmu_cgc_mode = "0x00020202"
preempt_record_bytes = "0x225000"  # 2196 KiB
# Reserved GMU payload pool: physical pages the driver adopts over IODeviceMemory::withRange
# instead of allocating from the kernel VM after userland has wired it. Must match the ADT's
# gmu-memory node (scripts/make-uke-adt.py) and the "GMU Pool" entry of the uke UEFI memory map.
gmu_pool_base = "0xc8000000"
gmu_pool_bytes = "0x2000000"
ubwc_version = 4
ubwc_swizzle = 3                  # levels 2 and 3
highest_bank_bit = 16
gmu_core_clock_hz = 220000000     # GMU core clock target for the A732
gmu_hub_clock_hz = 200000000
# Collected from the rooted device on 2026-10-21. The firmware is gen71100
# (matching compatible qcom,adreno-gpu-gen7-11-0), not the gen71500 sibling.
frequencies_mhz = [950, 900, 835, 736, 684, 633, 500, 353, 255]
num_pwrlevels = 9
initial_pwrlevel = 8
min_pwrlevel = 8
max_pwrlevel = 0
firmware_sqe = ["gen71100_sqe.fw", "gen71500_sqe.fw", "a732_sqe.fw"]
firmware_gmu = ["gen71100_gmu.bin", "gen71500_gmu.bin", "a732_gmu.bin"]
firmware_zap = ["gen71100_zap.mbn", "gen71500_zap.mbn", "a732_zap.mbn"]
firmware_source = "/vendor/firmware + /odm/firmware"

[gpu.firmware_pins."gen71100_sqe.fw"]
bytes = 66036
sha256 = "b6df660d109504dbea5a266910b037a33d893a11c6de52f524a5fd112008c401"

[gpu.firmware_pins."gen71100_gmu.bin"]
bytes = 80680
sha256 = "435c7bac9a328b8a100df930b84b65b4d579e42be44785d0e60e3729291bb864"

[gpu.firmware_pins."gen71100_zap.mbn"]
bytes = 12088
# Pulled from this unit (uke, 2410CRP4CC) at /odm/firmware/gen71100_zap.mbn on a stock Android
# build; the size matched the inherited pin (12,088 B) but the digest did not, so the pin above
# came from another build or SKU. scripts/check-uke-gpu.py compares against this value.
sha256 = "78530c380db9506149703db508ad960a966ec449b02fc8d2de90972e66bc9301"

[kernel.prelink]
# kits/XnuPrelink is the catalog's own path for this kit (components.toml: path = "kits/XnuPrelink").
# The tree materialises the kits/<feed name> symlinks from feeds.toml, and the board copy is the
# `XnuPrelink` entry there, so the alias name kits/NativePrelink does not exist in the tree: naming it
# here made pass 3 die with
#   can't open file '.../tree/kits/NativePrelink/emit_prelink.py': [Errno 2] No such file or directory
# (CI runs 42080292233 and the one after it). The compatibility alias is provided in this repository
# as a symlink for the audit scripts that hardcode it, which is all it was ever needed for.
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# kernelcache.release.mac17j — the KernelCache entry of the k114cap/Mac17,11 identity declared in
# [ipsw] (26C5035r), read through the same pipeline the driver uses (IM4P payload, LZFSE decode, keep
# the single 0x0100000c slice).
#
# INHERITED, NOT MEASURED HERE: this digest is upstream's for exactly this member of exactly this
# identity (profiles/os/macos-27.3-26C5035r, [kernel.prelink] kernelcache_sha256).
# CONFIRMED 2026-11-15: the 26C5035r image is now in the tree, and the sha256 of its decoded kernelcache
# (work/push/UniXNU/out/ipsw/26C5035r/kernelcache.decompressed, 124,518,400 B) is exactly the pinned value
# below, so this is a measured match and not a guess. kernel.prelink() compares it and stops with "does not
# match the kernelcache this board was qualified against" if a future image differs.
#
# The values it replaces: 697e01d6… was kernelcache.release.mac17g of the 25F84 image (the identity this
# board declared until the OS profile moved to 27.3, and still the cache the uke prelink round was
# measured against), and f18b4df8… before that was kernelcache.release.ipad7 — the iPadOS 17.7.11 image
# the board was ported against; scripts/inspect-target-prelink.py still asserts it for that cache.
# Inherited pins are silent with the wrong IPSW and only fail here, at fetch time.
kernelcache_sha256 = "d1003b5143ffd88439b4d45b6017f587171cfe6855660bed05370a2ea5db9fe9"
slide = "-0x1000000"
# Unchanged from the 25F84 round, and unverified for this collection: upstream's 27.3 profile declares no
# slide at all (it describes mac17j as a fileset that stays at its linked addresses, "there is no slide"),
# while this board has slid the mac17g collection by -0x1000000 since the port began. Whether that offset
# is still right for mac17j cannot be settled without the 26C5035r kernelcache; a wrong slide shows up as
# a kernel that faults at its first fetch, not as a build error.
# No early_security_init: the inherited address (0xfffffff005ab4ae0) is the AMFI entry of the iPadOS
# 17.7.11 kernelcache — docs/devices/nx769j.md records exactly that value as belonging to that profile
# and 0xfffffff004e2b640 to its own, so a prelink ABI address never carries over. It also has to be
# re-derived from mac17g's __PRELINK_INFO, and the caihong/nx769j records say running AMFI early
# security init on a SoC with no Apple PMGR panics with "AMFI: No PMGR?" — uke is a Snapdragon. Boot
# without the hook first and only then, if AMFI trust blocks userland, read the address out of mac17g.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
  # The USB stack, for drivers/QcomDwc3 (the official route). Everything above is what the 25F84/26C5035r
  # port needed before there was a controller; these eleven are the device stack, the host stack and the
  # storage chain they pull in, copied from the sheng board, which runs this driver on the same generation
  # of Apple USB code (UniXNU-sheng board.toml [kernel.prelink] roots).
  #
  # Why each one is named rather than left to be pulled in: the prelink walks *dependencies of the roots*,
  # and these eleven are what makes the closure contain the USB kexts at all -- QcomDwc3Xdci derives from
  # AppleUSBXDCI, whose kext has no personality, so nothing else would ever load it.
  #
  # The two `!` entries exclude rather than add. AppleUSBXHCI's metaclass comparison reaches
  # AppleOnboardSerial and AppleSMC, neither of which can exist on a Snapdragon; excluding them keeps a
  # match from silently binding a serial or SMC personality to our controller's name.
  "com.apple.iokit.IOUSBDeviceFamily",
  "com.apple.driver.AppleUSBXDCI",
  "com.apple.driver.AppleUSBDeviceMux",
  "com.apple.iokit.IOUSBHostFamily",
  "com.apple.driver.usb.AppleUSBXHCI",
  "com.apple.driver.usb.AppleUSBHub",
  "com.apple.driver.usb.AppleUSBHostCompositeDevice",
  "com.apple.driver.usb.IOUSBHostHIDDevice",
  "com.apple.iokit.IOUSBMassStorageDriver",
  "com.apple.iokit.IOSCSIArchitectureModelFamily",
  "com.apple.iokit.IOSCSIBlockCommandsDevice",
  "!com.apple.driver.AppleOnboardSerial",
  "!com.apple.driver.AppleSMC",
]

[firmware]
config = "uke"                   # Resources/Configs/uke.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/ukePkg/uke.dsc"
fd = "Build/ukePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-uke.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "uke"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "uke-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
volume = "UKEESP"
size_mib = 80
# A prelinked macOS kernel is a kernel collection: its image is as large as the original kernelcache
# (132.8 MiB for the 25F84 collection; the 26C5035r one is not measured here), and vendor_boot_a is
# 96 MiB (0x6000000). The payload therefore carries
# Payloads/kernel.macho.lzma (22.8 MiB, LZMA_ALONE) and DarwinBoot decompresses it before parsing;
# a boot-test kernel is a plain MH_EXECUTE and stays uncompressed, because the loader reads the plain
# file first. See docs/11 §27 and docs/13 §5.
compress_kernel = true
loader = "firmware"
title = "macOS 27.3 (26C5035r) - self-built 4K XNU"
# The firmware's Tools menu: without it the payload carries no Tools entry and the Advanced Logger QR
# exporter (Driver/AdvancedLogDxe) has no way in. payload.py:243 emits the entry only when this is set.
tools = true
# Which entry the countdown picks. "tools" reaches Tools -> Advanced Logger (the QR log exporter) on a
# board with no usable keys; "xnu" is the normal boot.
default = "xnu"
dram_size = "0x13FE00000"            # XNU VM DRAM: this unit's whole high run (0x8C0000000-0xA0000000, 5 GiB).
                                     # 8 GB SKU (MemTotal 7492 MiB); the 12 GB reference has 0x240000000 here.
dram_base = "0x8C0000000"            # high DRAM range 0x8C0000000-0xA0000000; the ADT writes /chosen/dram-base
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = true                  # native XNU panic output; Font.h is vendored in scripts/
# The signed root-policy bundle build-sheng-source-storage.py writes: with
# XNU_SOURCE_STORAGE_TABLES=userdata only the 544-byte header of each policy travels here, as
# Payloads/kernel.macho.vroot, and payload.py:155-158 refuses a bundle whose header count or length does
# not match the file. The hash tables themselves ride in the userdata image as the "<window>.vroot" data
# objects. Same key, same path and same reason as Allenwdk/UniXNU-uke's board.toml on this device; a
# missing one is silent — the kernel then has no policy to authenticate the root against.
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
# The pin below is the StaticTrustCache of the 25F84 image, so it does not belong to the 26C5035r one this
# board now declares. Commented out rather than carried: payload.py only applies the list to a trust cache
# passed with --trust-cache, so leaving the old value would reject the new image's cache while removing it
# accepts any. Neither is a decision this change can make without the image — re-derive it with
#   unixnu ipsw fetch -D . StaticTrustCache   # then sha256sum the member it extracts
# and put the digest back here.
# trust_cache_sha256 = [
#   "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
# ]
# The owner-built Metal addon (build-gpu-addon-blob.py, produced by the kernel
# archives above): payloads/kernel.macho.gpuaddon, placed by the DarwinBoot
# loader after the trust caches and staged into Data by kern_exec.c.
gpu_addon = "build/uke-gpu-addon/gpu-addon.z"
kernel_args = [
  "-v",
  "serial=3",
  # 0x14a = 0x14e minus DB_NMI (0x4). The rest is unchanged and inert on a board with no UART (DB_PRT
  # 0x2 / DB_KPRT 0x8 are serial output, DB_ARP 0x40 is arp debugging); the console text this board
  # actually reads comes from -v, -enable_kprintf_spam and -uketextconsole. DB_NMI is deliberately OFF
  # because it is the bit that makes a panic end in a spin instead of a reset, which is what keeps the
  # pram panic log from ever being readable:
  #   debug.c panic_init()  -> panicDebugging = TRUE when (debug_boot_arg & DB_NMI)
  #   debug.c Debugger()    -> if (PE_i_can_has_debugger(NULL) && panicDebugging) { ...; panic_spin_shmcon(); }
  #                            and the only path to the reset, `if (!panicDebugging) kdp_machine_reboot_type(...)`,
  #                            is skipped; PE_reboot_on_panic() also answers FALSE in that case.
  # A spinning kernel leaves the buffers only recoverable by a long press, and a power-off drops the DRAM
  # the log lives in. With DB_NMI clear the panic path flushes the region (paniclog_flush ->
  # PE_sync_panic_buffers) and then calls PEHaltRestart(kPEPanicRestartCPU). Note the remainder: that
  # reset goes through gIOPlatform, so a panic taken before an IOPlatformExpert exists still spins
  # (PEHaltRestartInternal returns -1) -- the stall probe and the lock watchdog cover that window.
  "debug=0x14a",
  # Round b170 (2026-11-13) switched the hand-rolled GIC path OFF and moved to the upstream one:
  #   * upstream's device records state it plainly - "Gunyah hypervisor: SGIs are not delivered, so
  #     IPIs use armcpu-spi-ipi=1" (UniXNU catalogue, device record for the same SoC class), and
  #   * the kernel reached this port's own uke_gic_arm_cpu() and died there: the store to
  #     GICR_IGROUPR0 (PA 0x17190080) is refused by the bus (esr 0x96000010, DFSC 0x10).
  # uke-gic=0 keeps uke-gic-timer.patch compiled in but inert, so that comparison stays one boot-arg away.
  "uke-gic=0",
  # armcpu-skip-gic=1 is OFF again (2026-11-17) and it was the bug, not a workaround. ArmCpu.cpp:671-677
  # returns from initCPU() before enableGic() when it is set: "CPU registration still happens; the timer
  # is left off". It was the second arm of b170's A/B test ("what happens when the kernel touches no GIC
  # MMIO at all") and it was never switched back, so every round since ran with NO timer interrupt. That
  # is exactly what the panel has been reporting, and none of it was a fault:
  #   ArmCpu: 0 timer interrupts, 0 IPIs in the first 10 ms after registration    <- no timer armed
  #   uke-stall-probe: samples=0 last_pc=...                                      <- the sampler rides PPI 27
  #   IOServiceWait / lck-mtx lines piling up after BSD init                      <- deadlines never fire
  # The working macOS reference (UniXNU-sheng, work/ref-sheng/board.toml:60) sets armcpu-spi-ipi=1 and
  # armcpu-self-ipi=1 and does NOT set skip-gic, i.e. its ArmCpu really does wake the redistributor and
  # enable PPI 27 from initCPU - the design the paragraph above describes. This round does the same and
  # keeps uke-gic=0 (the hand-rolled path stays out of the picture, so this is one variable).
  # What a failure looks like now: the same GICR_IGROUPR0 store refused with esr 0x96000010 DFSC 0x10,
  # but issued by ArmCpu::enableGic() from a kext with the console already up, so it is readable -
  # which is why -uketextconsole is restored in this round.
  # "armcpu-skip-gic=1",
  "armcpu-spi-ipi=1",
  # armcpu-probe DROPPED 2026-11-15: the 2026-11-15 11:51 photo shows that boot ending in
  #   panic(cpu 0): "ArmCpu: uke interrupt-path diagnostics -- read the lines above"  @ArmCpu.cpp:546
  # which is this switch, i.e. our own diagnostic, not a fault (ArmCpu.cpp:535-546: probe==1 ->
  # dumpIrqState twice, hold 15 s, panic on purpose, and it deliberately never reaches
  # registerService()). Dropping the arg restores the default (probe==0 -> kprintf
  # "armcpu-probe=0, continuing to registerService" and the boot continues).
  # It also frees 15 bytes of the 1000-byte command line (payload.py:38): 997 -> 982.
  # "armcpu-probe=1",
  # Round B14 diagnostics: fileset-wait-log names every IOService a kext waits on, and
  # fileset-wait-cap-ms turns an unbounded wait into a 5 s one so the caller reports what it wanted
  # instead of hanging silently. Both are inert unless this kernel carries fileset-wait-probe.patch.
  # "fileset-wait-log=1",   (the wait names are now printed unconditionally by uke-aes-stub.patch)
  "uke-aes-stub=1",
  # "fileset-wait-cap-ms=5000",  (dropped for the 1000-byte cap: the probe now runs synchronously
  # at EARLY_BOOT and panics with its breadcrumbs, which is uke_usb_sync=1's whole purpose. The
  # fileset wait names print unconditionally from uke-aes-stub.patch, so the cap is redundant.)
  # DEVELOPMENT kernels keep kprintf off unless this is set; uke has no UART,
  # so kprintf then falls back to the framebuffer video console. Graphics boot
  # suppresses text until -uketextconsole switches the console to text mode.
  "-enable_kprintf_spam",
  # PARKED for the b226-card round, and it is the one variable changed. -uketextconsole puts the
  # console into text mode, and with kprintf spam on, that text repaints faster than the diagnostic
  # card's once-a-second fb_paint -> the b225 photos came back as a full screen of console text with
  # no card on it, which left the round without its readout (PW/PC/PF/PS, the numbers that say
  # whether the vendor eUSB2 sequence actually took effect). Without this arg the graphics console
  # stays as it is and the card owns the panel. Cost: kernel text is no longer drawn, so a panic is
  # only readable through the panic screen itself. Restore this line when text is what is being read.
  "-uketextconsole",
  "kt_fixed_zones=120",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  # Parked while CONFIG_XNU_NATIVE_LEGACY_DISPLAY is off to keep kernel_args well under 1000 bytes
  # after adding native-source-storage=1, log=1, apfs-boot-shim=1 and bluetooth=1:
  # "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  # "offline-legacy-validate=1",
  # "offline-legacy-transfer=1",
  # "offline-legacy-cpu-present=1",
  # own-present (the gpu-framepresent v2/v3 verified set): presentBase resolves
  # the swap record's overlay surface after each SwapEnd and copies it to the
  # GOP. Without this the path is silent and the screen stays on the boot frame
  # (the 2026-10-27/28 frozen-screen runs never set it).
  # the screen console must not draw over presented frames; it is muted only
  # after the first successful copy, so logs survive until the UI takes over.
  "offline-legacy-noconsole=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  # Touch bring-up (docs/TOUCH-PORT.md on-screen set): stage 4 = firmware
  # download + frame loop; sheng-touch-hid=1 publishes digitizer reports
  # (required); poll mode is the device-proven frame path (the interrupt path
  # is not yet verified on hardware and falls back to polling by itself).
  "sheng-touch=4",
  "sheng-touch-hid=1",
  # "sheng-touch-poll=1",   (parked: 2 bytes over the 1000-byte command line; touch polling is far
  # past the interrupt-controller question this round asks)
  "offline-legacy-phase=4",
  # GPU track (same values as gpu-framepresent v2/v3): the staged A732 bring-up
  # publishes the Metal device and the compositor submits the 1200-byte overlay
  # records whose layer 6 frame the own-present path resolves.
  "sheng-gpu-power=9",
  "sheng-gpu-metal=1",
  # GPU scanout hand-off (upstream GpuScanoutClient path): the addon plugin's
  # scanout client blits the offered frame into the scanout on the GPU; a
  # refused offer or failed copy falls back to the CPU copy (fail-safe).
  "sheng-fb-gpu=1",
  # DPU direct scanout: map the compositor's plain BGRA surface into the display bank's stage-1
  # window and flip VIG0/VIG1, instead of the 27 MB CPU copy per frame.
  "uke-dpu-scanout=3",
  # "sheng-gpu-pool=1536",   (parked for the 1000-byte command line: the GPU pool size only matters
  # once NativeAdreno runs. Restore when the boot reaches userland.)
  # The display refresh tick (upstream display port): 120 Hz vsync messages from the family's own sender, so the render
  # server paces to the panel instead of its 1/60 s heartbeat, and IOMFBDisplayRefresh reports the panel rate.
  # "sheng-vsync=120",   (parked to make room for uke-gic-diag=1 under the 1000-byte command-line
  # cap: the GPU only reaches a vsync consumer long after the point this round is measuring, and the
  # token costs 16 bytes. Restore it when the boot gets past the interrupt controller.)
  # stage the owner-built NativeAdrenoMetal bundle (addon blob) into Data so the
  # render server opens a native Metal device; iconservicesagent then keeps
  # CoreImage on that device instead of the null-GL crash loop.
  # Stage the runtime addon into /private/var/ngpu (zzy-native-gpu-addon-mount.patch reads `gpu-addon`,
  # not `sheng-gpu-addon`; required for Metal, macOS boot shims and Bluetooth firmware/userspace).
  "gpu-addon=1",
  # Round B14 measures AppleImage4's waits, not the graphics stack: iconservices and the staged-app
  # copy sit past root mount, and the kernel command line is capped at 1000 bytes (it was 987 before
  # the two fileset-wait args below). Restore both once the kext stage is passed.
  # "sheng-iconservices=1",
  # OFF for this round, and it is the one variable that changed: it decides whether bsd_init loads
  # com.apple.iokit.IOMobileGraphicsFamily at all (bsd/kern/bsd_init.c, native_mobile_graphics_load_probe).
  # The b221 run stopped with "IOGPUInterruptController: not registry member at registerService()", a
  # message whose only possible source is that family (IOGPUFamily is a prelink root, board.toml:348),
  # and this board publishes no display provider at all - make-uke-adt.py emits no display/framebuffer
  # node and the graphics components are off in uke-macos_defconfig. So the family is being loaded into
  # a system that cannot host it. Two answers are worth the same boot:
  #   the line disappears  -> it came from IOMobileGraphicsFamily, i.e. the boot is now blocked
  #                           somewhere else and the graphics track owns this failure (docs/GPU-PORT.md);
  #   the line stays       -> it does not come from that family and the b221 reading was wrong.
  # The client probe is nested inside the load branch, so "offline-mobile-graphics-client=1" below is
  # inert while this is 0 and costs nothing.
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=0",
  "offline-apfs-load=1",
  "apfs-boot-shim=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  # usb= is the single interface of the USB side (they own drivers/QcomDwc3, package/UsbProbe.cpp and
  # package/qcom-usb-debug; this file owns the arguments). package/UsbProbe.cpp, the entry point the
  # merge keeps as the enabled USB owner, reads it:
  #   1  bring the controller up and stop there. Nine stages, one "qcom-dwc3: stage N" line each and two
  #      "UKE usb:" summary lines after the attempt; stage is negative when a step failed. This is what the
  #      USB line ships (b252): on b251 the driver was force-loaded and never called at all, so the first
  #      job is the bring-up reading, not the Apple stack.
  #   4  also load AppleUSBXDCI/AppleUSBXHCI and publish the two subclasses (bounded retry, reports the
  #      load result). Try it with a payload rebuild -- this is a boot argument, not a kernel change.
  #   5  and additionally run qcom_dwc3_diag(true), the controller-off-the-bus cycle.
  #   6  panic after bring-up with the judgement line (stage/gsnpsid/gdsc/smmu/rep/qmp/rpmh/irq), so a
  #      single photograph of the panel carries the whole verdict.
  # 1 here, not 6: 6 stops the boot inside bsd_autoconf(), and this round also asks whether the boot gets
  # PAST BSD init. A deliberate panic there would answer the USB half and hide everything after it.
  # Flipping to 6 is one character when the USB readout is what matters.
  # No log-sys (that group belongs to package/BootLog.c, which this port does not carry) and no IOSleep:
  # this kernel's timer never delivers an interrupt, so every delay in the route spins on the timebase
  # (uke_delay_ms in package/QcomDwc3Platform.c). UsbProbe.cpp prints the stage table itself.
  # ONE USB OWNER PER KERNEL, and this is the whole of the arbitration: drivers/QcomDwc3 and both CDC-ACM
  # consoles (package/qcom-usb-debug's libQcomXnuUsbDebug.a and package/uke_usb.c) program the same DWC3
  # controller -- and package/QcomRpmh.c is a byte-identical copy of package/qcom-usb-debug/soc/QcomRpmh.c,
  # so linking both archives is also a duplicate symbol. This round links libQcomDwc3.a only:
  # CONFIG_XNU_QCOM_USB_DEBUG=n keeps the component built but out of the link (board.toml [kernel]
  # archives still runs build-qcom-usb-debug.py, so it stays buildable), the line below keeps
  # qcom-usb-debug= off, and uke_usb=0 keeps the old probe driver inert. Going back to the CDC-ACM console
  # is those three flipped and libQcomDwc3.a dropped from CONFIG_XNU_EXTRA_LD_ARCHIVES.
  # usb=4: this round is the Apple stack, not the bring-up. The bring-up needs no round of its own any more -- usb10
  # reported stage=9 with the ladder intact (gsnpsid=33313130, both USB30 GDSCs powered f8222f80/f8222800, smmu=00450000,
  # repeater=02290180 = APID 553 answering with bit 7 set) and the kernel went on into userland afterwards with no panic.
  # 4 is upstream's next level (package/UsbProbe.cpp): load com.apple.driver.AppleUSBXDCI and ...usb.AppleUSBXHCI, run the
  # subclass static init between preModLoad and postModLoad, then qcom_dwc3_publish(), which walks its own ladder --
  # stage 10 the nub ("usb-drd0") registered, 11 the controller started, 12 the role thread, and negative stages -12..-17
  # naming which of those failed. Same byte count as "usb=1", so the 1000-byte command line is untouched.
  "usb=4",
  # usb-rails=0 keeps the board's RPMh vote out of this round and uses the power the bootloader left behind. It is not a shortcut
  # past a hardware finding: on 2026-11-21 the vote ran (votes 1-5 of 17 completed, the sixth stopped the bus) and, with the vote
  # skipped entirely, both USB30 GDSCs collapsed and read back powered -- stage 3 passed on that same inherited power. So the two
  # questions are separable, and this round spends its photograph on the second one: the clock and PHY groups of stages 4 to 9,
  # each of which now prints its own `qcom-dwc3: mark <group>` line before touching a block. The vote keeps its own round.
  "usb-rails=0",
  # usb-conn=1 asserts GCTL.SOFTCONN from the beat sampler, i.e. pulls the device up by hand. The family does it
  # in XDCI_POWER_ON, which configd's USBDeviceConfiguration asks for -- and this board has no userland yet, so
  # nothing asks. With the counter in the beat line (`pwron=`) one panel then says which of the two it is: a
  # family that never powered the core (pwron=0, pullup forced, link still dead) or one that cannot connect.
  "usb-conn=1",
  # Qualcomm WCN6750 Bluetooth over SM7675 UART10 (QUPv3_1 SE2 @ 0x888000, 3 Mbaud, /dev/cu.BLTH).
  # The background worker waits for native_gpu_addon_stage >= 1 (staged /private/var/ngpu/firmware/qca)
  # before powering WCN6750 rails, so early boot is unaffected. Add `log-bluetooth=2` (controller RX/
  # process trace) or `log-bluetooth=3` (HCI ring buffer) or `bt-rails=0` (skip RPMh vote) when
  # debugging (keep total kernel_args <= 1000 bytes; currently 995/1000 with bluetooth=1).
  "bluetooth=1",
  # Arms the userdata half of UkeLastLog (UkeLastLog.c:789; the pram half needs panic_region and stays
  # off). The transport is freestanding - UfsLog.cpp/UfsLogKernel.c map the UFS host and the apps SMMU
  # themselves - so it does NOT need CONFIG_XNU_NATIVE_UFS, contrary to the 2026-11-17 report from the
  # device side: their two zero-record reads used uke-log-first=256566 / uke-log-last=281141, which are
  # an order of magnitude away from the GPT values this board carries (2,961,408 / 61,949,946 in
  # [userdata]), so the window they opened was not the userdata tail at all. This round ships the correct
  # pair plus sheng-log=1, which is the actual test of that channel.
  "sheng-log=1",
  # NativeUfs.cpp:1801 reads `log=1` (while UkeLastLog.c:924 reads `sheng-log=1`), so pass both.
  "log=1",
  # The disk log window, back after b261 removed it to pay for uke-platform-error-panic=1.
  # uke-platform-error-panic is gone instead: the GIC-read storm it guarded against was fixed in
  # b262/b263, and a full kernel log in userdata is worth more than a panic on the first ignored
  # error. NativeUfs reads these two as ABSOLUTE LBAs of userdata (4096-byte blocks) on LUN 0 and
  # opens the last 8192 of them: start = last + 1 - 8192 = 61941755. They come from this unit's own
  # GPT (blockdev --getsz userdata = 471908312 sectors = 58988539 blocks = last - first + 1), which
  # is also the geometry work/analysis/read-uke-log.py reads back through TWRP.
  "uke-log-first=2961408",
  "uke-log-last=61949946",
  # XNU panics with "Console I/O from interrupt-disabled context" (osfmk/console/serial_console.c:181,
  # console_io_allowed) as soon as anything prints with interrupts masked. On this port that fires late
  # in kext loading, after AppleImage4 has already logged its nonce-slot failures; the tunable's own name
  # is the boot-arg (TUNABLE(bool, allow_printf_from_interrupts_disabled_context, "nointr_consio")).
  # Passing it keeps the boot going so the next panic is the interesting one instead of this noise.
  "nointr_consio=1",
  # b261: make the FIRST platform error panic instead of being swallowed. The 2026-11-18 00:37 boot
  # printed "ArmDTPlatformIO: platform error ... (ignored)" without end, and the kernel never reset, so
  # the DRAM the diagnostics live in was only recovered by a long press - which loses it. ArmDTPlatformIO
  # returns false when this is set, and the machine layer then panics, which resets through PSCI and keeps
  # DRAM: the next firmware boot can then export the Advanced Logger buffer, kernel lines included.
  # Paid for by dropping uke-log-first/uke-log-last: that userdata window never produced a record (the dump
  # was 517 non-zero bytes out of 32 MiB), and the QR channel is the one that now works.
  # 0 for this round, and stated here rather than injected by the build script. configs/uke-macos_defconfig
  # still has CONFIG_XNU_NATIVE_UFS off, so this kernel carries no UFS driver and
  # drivers/NativeUfs/NativeUfs.cpp:2089 returns false on a 0 argument anyway - the value itself changes
  # no behaviour. What it does change is scripts/unixnu/payload.py:check_native_root(): with 1 it demands
  # exactly one pmgr=2 plus the _sheng_pmgr_run symbol, neither of which this train links, so the build
  # stops - or silently passes native-ufs-root=0 behind your back through
  # tools/build-payload-linux.sh:186-189, which is the trap the device side hit on 2026-11-15. The storage
  # round puts this back to 1 together with the policy directory and CONFIG_XNU_NATIVE_UFS.
  # SourceStorage.cpp:139 requires `native-source-storage=1` (alongside native-ufs-root=1 and the
  # vfsinit() call site in zzzzzzzzzzzzzzzzzzzzz-uke-source-storage-start.patch) to load IOStorageFamily,
  # start NativeUfs and publish IOMedia for root mount.
  "native-source-storage=1",
  "native-ufs-root=1",
  # The payload gate (scripts/unixnu/payload.py:71) demands exactly one `pmgr=2` beside
  # native-ufs-root=1, because the unchanged target AMFI panics with "No PMGR" otherwise. sheng-pmgr
  # stays too: that is the argument package/ShengPlatformPower.cpp reads for our own integration.
  "pmgr=2",
  # NativeUfs.cpp:1566 reads `data-persist` (not `sheng-data-persist`).
  "data-persist=2",
  # "sheng-staged-apps=1",   (see the note above: dropped for the 1000-byte command-line cap)
  # sheng-log=1 is OFF for this round, and it is the one variable changed. It is the switch for
  # package/UkeLastLog.c, whose writer is started from the first csr_check and whose transport
  # (package/UfsLogKernel.c) maps 0x01d84000+0x3000, programs the apps SMMU for stream 0x60, stops the
  # firmware's request list and sends one NOP OUT -- i.e. it touches the UFS controller very early,
  # before any kext has run. The stock kernel's own boot log shows what UFS needs first: RPMh rails and
  # the ref_clk, gcc_ufs_phy_gdsc, 8 GCC branches, TLMM pad 178 (UFS_RESET) released, the GIC ITS as
  # msi-parent and apps-SMMU stream 0x60. This board's firmware deliberately does not ship
  # UFSDxe/ClockDxe/RpmhDxe/SPMIDxe (uke.dsc), so none of that is done for us. If the ABL hands UFS
  # gated, that first access is a bus timeout -- a synchronous external abort, which is exactly the
  # shape of the panic this round is chasing. uke-serror-detail.patch reports esr/far/pc either way, so
  # this costs one boot and settles whether our own log channel is what stops the kernel.
  # PARKED again after b224 was prepared and NOT shipped: it works, but the window is the last
  # 32 MiB of the userdata partition, and on this unit /data is f2fs over a dm device that covers
  # exactly the same 58,988,539 4K blocks (measured 2026-11-15 with df/blockdev on the live Android
  # install). Turning this on therefore raw-writes 32 MiB over live f2fs data. Move the window to a
  # partition nothing else uses (slot B's boot_b is the obvious candidate) before enabling it again.
  # The pram half of package/UkeLastLog.c runs unconditionally and does not need this switch.
  # "sheng-log=1",
  # The userdata copy of the message buffer (package/UkeLastLog.c, UKE_LOG_USERDATA): an absolute
  # first/last LBA of userdata on LUN 0, so the writer can open the last 32 MiB of it and append one
  # 16 KiB record every 2 s. Absolute, because the transport sends SCSI READ/WRITE(10) LBAs while the
  # recovery-side dd counts from the partition start.
  #
  # Where the two numbers come from. [userdata] above records the GPT entry (0x2d3000..0x38417fa) and
  # that record is stale: the live partition is 58,988,539 4K blocks of 225 GiB starting at 2,961,408,
  # so its last LBA is 2,961,408 + 58,988,539 - 1 = 61,949,946 and the 32 MiB window starts at
  # 61,941,755 -- which is the LBA the previous port's driver logged ("opens LBA61941755") and the
  # same 8192 blocks TWRP reads at skip=58980347 of /dev/block/sda32. The arithmetic is the check:
  # a stale end would move the window silently, which is why the start is passed too.
  #
  # Names, not sheng-log-*: the pram writer's sheng-log=1 is upstream's switch, these two belong to
  # the freestanding UFS writer in package/UfsLog.cpp. They are short on purpose -- the command line
  # is capped at 1000 bytes and 949 were already in use.
  #
  # RESOLVED 2026-11-20 (user decision: "follow upstream"): the userdata ring stays. Upstream's own
  # convention for this board is the same one — Allenwdk/UniXNU-uke records it as "UkeLastLog writes a
  # 16 KiB record into the last 32 MiB of userdata every 2 s" (docs/RECOVERY-LOG.md, with sheng-log=1 in
  # board.toml kernel_args), and upstream's log-capture guide places the reference region inside userdata
  # as well. So this is not a local preference: it is the upstream layout, and the slot-B pair below is the
  # divergence. The 32 MiB cost against /data is accepted with it, as upstream accepts it.
  # MERGE NOTE (branch usb-on-macos, ci-b276-storage4 x ci-b250-ufsclk). Both lines moved this window and
  # both were reviewed; the two pairs are mutually exclusive, because the arguments themselves are the
  # conflict:
  #   this line (b276, 5477e52, 2026-11-18)  uke-log-first=2961408  uke-log-last=61949946   userdata
  #   the USB line (b250, b253, 2026-11-17)  uke-log-first=256566   uke-log-last=281141     slot B boot_b
  # boot_b is the safe one and the current line's own note (above) argued for it: the userdata tail of
  # this unit is live /data (dm-60 covers exactly these 58,988,539 blocks), so a successful write costs
  # 32 MiB of f2fs. The pair kept here is nevertheless userdata's, because it is what the storage rounds
  # b270-b276 shipped and measured against and this merge must not silently change the storage line's log
  # channel. Swap "uke-log-first/uke-log-last" for 256566 / 281141 -- and treat boot_b as dirty, reflashing
  # it afterwards -- when the /data overlap is judged unacceptable before the next flash. Nothing else
  # changes: sheng-log=1 is already set above and both pairs are inside the 1000-byte command line (991).
  # The old probe driver (package/uke_usb.c) is now inert, on purpose. Three of its switches would
  # each stop the boot before QcomXnuUsbDebug's worker runs: uke_usb_sync=1 panics inside its
  # STARTUP by design ("uke_usb_sync=1's whole purpose"), uke_usb_hook=1 reaches
  # uke_usb_probe_and_freeze(), and uke_usb=1 with no uke_usb_power writes the GDSC and all five USB
  # branch clocks - the same DWC3 the component owns. Its STARTUP still writes the UKEUSB-DISABLED
  # beacon into pram before returning, which is the one piece of evidence worth keeping.
  # uke_usb=0 alone disables the old probe driver (it returns before touching anything), so sync/hook/
  # panic are dropped rather than carried as zeros - the 1000-byte command line is full.
  # MERGE NOTE: the USB line (ci-b250-ufsclk) dropped this argument, because there the CDC-ACM console
  # was being retired altogether. Here it stays, and it is part of the single-owner arbitration: the
  # component (package/uke_usb.c, built by build-uke-usb.py) remains in the tree, and this is the
  # argument that keeps it from touching the DWC3 that drivers/QcomDwc3 now owns. 9 bytes.
  "uke_usb=0",
  # ON again for the b204 channel round, and this time the firmware fills the hole that made every
  # earlier attempt impossible: UkeUsbLogDxe powers the USB30 GDSC, releases the block reset and ungates
  # the three high-speed branches before hand-off (PcdUkeUsbPowerOn), because nothing else in this boot
  # can - the vendor ClockDxe that owns gcc_usb30_prim_gdsc black-screens this tablet, and the kernel's
  # own QcomUsbQualify may only change CBCR ENABLE bits (QcomUsbQualify.h:103-105). A power-gated DWC3
  # ignores every register write, which is what killed the CDC-ACM before GET_DESCRIPTOR.
  # The OneSend card stays off (it now needs qcom-usb-qr=1), so the panel keeps the plain kernel text.
  # If the kernel hangs in USB init instead of reaching kext loading, set this back to 0: that is one
  # payload rebuild, not a CI round, and it restores the previous boot exactly.
  # OFF for the official-route round, and this is the one variable changed. The CDC-ACM probe
  # (package/qcom-usb-debug) and drivers/QcomDwc3 both drive the same controller: the probe programs
  # DEVCTRL/DEVCTRLHLT and arms ep0 its own way, so leaving it on would fight the official sequence for
  # the core reset. It stays force-loaded (CONFIG_XNU_QCOM_USB_DEBUG) because its switches are what the
  # previous rounds read, so turning it back on is this one line, not a rebuild of the archive.
  # "qcom-usb-debug=1",
  # The official route's call site: patches/xnu/zzzzzzzzzzzzzzzzzzz-uke-usb-start.patch calls
  # uke_usb_probe() from the first statement of bsd_autoconf(), not from
  # native_legacy_display_late_probe() -- that caller is compiled only when CONFIG_XNU_NATIVE_LEGACY_DISPLAY
  # is on, which this board leaves off, and b251 therefore shipped libQcomDwc3.a force-loaded and never
  # called. The usb= levels, the no-IOSleep rule and the single-USB-owner arbitration are documented at
  # the usb=1 argument above; the argument itself lives there and only there (one copy -- the merged
  # command line is 991 of its 1000 bytes).
  #
  # The evidence this route produces is console text (qcom-dwc3: and the "UKE usb:" stage table), which
  # the graphics console does not draw, so -uketextconsole above is what makes the round readable.
  # b206's firmware log (Advanced Logger export, 2026-11-14 01:45) settled the hand-off question the
  # other way round from what b204 suggested: the USB30 GDSC was powered all along (UkeProgressDxe at
  # 00:00:07.443 already printed gdsc_powered=1 usb_clocks_running=3/3, and the DWC3 answers with
  # gsnpsid=33313130). What b204's probe saw as pwr=0 clocks=1/3 was that version's own bad write
  # (CFG_GDSCR.POWER_UP_COMPLETE is a read-only status bit) collapsing the domain. UkeUsbPowerOn now
  # follows Qualcomm's gdsc.c and leaves the block in exactly the state QcomUsbQualify demands:
  # pwr_on=1 up_complete=1 collapse=0, clocks=3/3, DWC3 halted=1.
  # ON, because this round's read-out is the component's own card and not the kernel console. The card
  # is painted with direct framebuffer writes by QcomXnuUsbDebug (fb_paint), so it cannot be affected by
  # where kprintf is routed - and after a successful qcom_usb_debug_init the console sink is the USB
  # backend, i.e. exactly the channel that does not work yet. The card carries the state line
  # "PH E CR S ER LS FSR GW" as text under the symbol (60 columns), and FSR/GW are this round's two
  # numbers: FSR 00000400 = the SMMU recorded no fault, GW 0 = the core never posted an event.
  # What the card costs is console lines (it repaints every second to stay on top), which is why it
  # stayed off in the rounds that were reading kernel text instead. Set to 0 for those.
  # The panel now paints the request and a QR of it without panicking (STATE 82/84), so the diagnostic
  # panic stays off: with it on, the first control request stops the machine and enumeration can never
  # be tested. qcom-usb-panic=0 overrides the compiled-in default of 2.
  "qcom-usb-panic=0",
  # Both spellings, on purpose. package/ShengPlatformPower.cpp:70 reads "sheng-pmgr" (this port's name),
  # while scripts/unixnu/payload.py:check_native_root() demands "pmgr=2" (upstream's name) before it lets a
  # payload carry native-ufs-root=1, and it does not know the sheng- prefix. Passing both costs 8 bytes of
  # the 1000-byte command line (967 -> 975) and keeps the gate satisfiable for the round that turns
  # SHENG_PMGR on. The gate's second condition is the _sheng_pmgr_run symbol, which the macOS train does
  # not link, so this round also declares vmm-present in [adt.defaults.u32] — see the note there.
  "sheng-pmgr=2",
  "sheng-lite=1",
  "sheng-aks=1",
  # The KeyStore implementation answers 0 by default while Apple's pairing check wants the
  # no-passcode state, which is 3 (Allenwdk/UniXNU-uke carries the same argument, added when the
  # lockdown session was being chased; docs/USB2-20261115.md records why).
  "sheng-aks-sls=3",
  # Documented diagnostic switch (unixnu.com/zh/xnu/boot-arguments): the security stage was the next
  # suspect after the nonce slot reads all failed, and this is the supported way to boot past it and see
  # what the next stage does. sheng-disable-watchdogd is dropped to stay inside the 1000-byte command line.
  "amfi_get_out_of_my_way=1",
  "sheng-smp=1",
  # uke-serror-resume=4 continues past an asynchronous platform error instead of stopping the boot,
  # after printing it and staging it into the pram panic header (uke-serror-detail.patch). Only the
  # asynchronous case is resumed: a synchronous external abort would re-execute the faulting load and
  # loop, and that one still panics with its esr/far/pc/ec. Four is a cap, not a target - a storm of
  # resumptions means the panic, not the resumption, is the answer.
  # Traded for armcpu-spi-ipi=1 to stay inside the 1000-byte command line (payload.py:38 enforces it):
  # ArmCpu's start() has never been reached on this board, so its SPI IPI switch is inert.
  # "uke-serror-resume=4",   (parked with uke-gic=0: this was the resume path for the synchronous
  # external aborts of the hand-rolled GIC setup, and those no longer happen. Costs 18 bytes.)
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  # Contiguous hints off. Round b143 reached the early VM setup past kext loading and died in
  # arm_vm_page_granular_helper (pc 0xfffffff00bbe377c = +0x3fc, lr = +0x2cc, osfmk/arm64/arm_vm_init.c)
  # on
  #   assert(!kva_active || (ppte[i] == ARM_PTE_EMPTY) ||
  #          ((ppte[i] & ARM_PTE_HINT) == (ptmp & ARM_PTE_HINT)));
  # which is XNU refusing to change the contiguous bit on a mapping that is already active: the range was
  # first mapped with ARM_PTE_HINT and is now being updated without it (or the other way round). The hint
  # is a TLB optimisation -- 16 adjacent PTEs declared contiguously mappable -- and it assumes the block
  # is physically contiguous with identical attributes; the 4 KiB BCM2837 layout this port runs on is
  # exactly the case where that assumption stops holding. Disabling it makes both passes agree instead of
  # papering over the mismatch; it is parsed by PE_parse_boot_argn("use_contiguous_hint") in arm_vm_init.c,
  # so it costs one command-line argument and no kernel rebuild.
  "use_contiguous_hint=0",
  # Dropped for the 1000-byte command line (DarwinBoot's cap; 984 used, 16 free): io=0x10 is the IOKit
  # match diagnostic that proved "ArmCpu was never a candidate". Restore it by swapping with the line
  # above when driver matching is the question again -- the two are 22 and 8 bytes.
  # "io=0x10",
]
# Fixups of signed text, applied by the kernel after signature validation (patches/xnu/native-text-fixup.patch); they reach it as
# /chosen/text-fixups, not on the command line. Each is <file name>,<file offset>,<original>,<replacement>, in hex. uke runs the
# same 21H461 iPadOS build as sheng, so sheng's fixup list applies verbatim.
text_fixups = [
  # +[AWAttentionAwarenessConfiguration initialize] (21H461) only forces +[AWClientPreferences initialize] and deadlocks
  # SpringBoard startup against it (ABBA between the main thread and Siri's SASMyriadController); it returns at once instead.
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  # BTAudioHALPlugin's factory returns NULL, so audiomxd skips it: with bluetoothd disabled (sheng-lite) the plugin reconnects to the
  # audio device and hangs audiomxd's startup (int-141), which keeps the speaker from ever being ready.
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
# The kernel panic-log region: the 2 MiB tail of the 5 GiB high run, carved out of the managed window
# (dts/uke.dts memory@8c0000000 stops at 0x9FFE00000 for exactly this) so it is real DRAM that XNU's VM
# never allocates. devicetree.py writes TWO things from this one value, because XNU reads two things:
#   * a TOP-LEVEL `pram` node with `reg = <0x9FFE00000 0x200000>` -- check_for_panic_log() resolves it
#     with SecureDTLookupEntry(0, "pram") from the ROOT node (pexpert/gen/device_tree.c FindChild walks
#     direct children only), so the `/chosen/pram` this used to emit was never found at all and the
#     panel said "pram=0 size=0" every round;
#   * /chosen/embedded-panic-log-size = 0x200000, the length it maps and writes. It must be <= reg[1]
#     (native-dt-panic-region.patch returns early otherwise) and it is the ONE place that number may
#     live now: the [adt.chosen.u32] copy that said 0x380000 is gone, and devicetree.py refuses to
#     build if a board declares its own again.
# Round b158 removed this line and the kernel came back to life with a panel message, so something on the
# pram path killed it silently in b156. Two candidates share this one switch, and b159 separates them: the
# node is back (so XNU's own check_for_panic_log() maps the region as Apple intends), while the EARLY_BOOT
# snapshot in package/UkeLastLog.c - our own write, at a point where nothing is even printed yet - is gone.
# panic_region = "0xFF800000:0x380000"   # off for this round: with the node + the size property
# present the kernel dies before the console (b156 vs b158, and again after the address was moved
# to upstream uke's 0xFF800000 in b175). The upstream uke repository does configure it, so the
# difference is in this tree's pram-path patches, not in the value; until that is settled the marks
# and the GIC diag need a kernel that starts, so the node stays out for this round.
tool = "scripts/make-uke-adt.py"
chip_id = "207"
owned_memory_size = "0x100000000"     # 4 GiB of this unit's 5 GiB high run (0x8C0000000..0xA0000000).
                                      # Ladder if DarwinBoot reports Out of Resources or the VM misbehaves:
                                      # 0xC0000000 (3 GiB) -> 0x80000000 (2 GiB). 12 GB reference used 4.75 GiB.
# The OS volume of the image this board installs, i.e. the same value as [root] os_volume_uuid and
# upstream profiles/os/macos-27.3-26C5035r [payload.adt] root_match_volume_uuid. It was 04769D26-...
# until 2026-11-17: that is the OS volume of iPadOS 17.7.11 21H461 (profiles/os/ipados-17.7.11-21H461
# os_volume_uuid), the image this port started from, so /chosen/root-matching named a volume that is
# not on this unit and IOFindBSDRoot could never match. The official macOS reference is explicit about
# this failure mode: "xnu waits for IOMedia, default matching Content=Apple_HFS; select the root by
# the verified BaseSystem APFS volume UUID, do not keep the default HFS selection"
# (Jelly10086/macOS-ForSheng docs/status.md, pinned in docs/MACOS-REFERENCE.md).
root_match_volume_uuid = "84581E99-85BE-4957-AC53-2947E887B3E4"
# mount(8) phase 1 requires a boot manifest hash to name /private/preboot/<hash>.
# uke has no Apple personalization manifest, so this is an explicit bring-up
# owner boot-set identity (SHA-384 of "UkeBringup.BootSet.v1\0"), not Apple data.
boot_manifest_hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
persistent_data = true               # sheng-data-persist keeps Data writes, so Data is not ephemeral storage
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; [bootimg.image] would override them.

# The stock ABL powers the panel off when the device tree has no splash region, so add it.
[bootimg.image]
header_version = 4
base           = 0x00000000
kernel_offset  = 0x00008000
tags_offset    = 0x01e00000
pagesize       = 4096

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

# The boot image has no ramdisk. The payload is the vendor_boot vendor ramdisk,
# which the ABL loads at 0x1000000; UkeBootMemoryDxe publishes this range as
# the FAT volume the boot manager scans.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = ["0x1000000"] },
  { name = "linux,initrd-end", type = "x", value = ["0x6000000"] },
]

[device_tree]
source = "device:dts/uke.dts"
include_dirs = ["soc:dts"]

# Board ADT overrides on top of the OS profile identity (the make-uke-adt.py
# baseline). The GMU pool rides as a top-level node; the panic log's top-level
# `pram` node is generated from [payload.adt] panic_region, not from here.
[adt.chosen.u32]
# No Apple CTRR on this SoC, so XNU must be *told* that. osfmk/arm64/machine_routines.c keeps
# _unsafe_kernel_text_initialized false until /chosen/kernel-ctrr-to-be-enabled exists as a 32-bit value
# (iBoot writes it on Apple silicon), and ml_unsafe_kernel_text() then hits assert() — which a DEVELOPMENT
# build keeps. dtrace's sdt_init() is the first caller at STARTUP, so the boot dies there:
#
#   Assertion failed: _unsafe_kernel_text_initialized at pc 0xfffffff00bc2b8f4 …
#
# That is exactly what b286's panic screen shows. Both reference boards declare this (Allenwdk/UniXNU-uke
# board.toml "No Apple CTRR on this board; XNU TUNABLES requires an explicit 32-bit value", sheng
# "This SoC has no CTRR: kernel text stays writable by hardware, which XNU must be told"), and 0 is the
# truthful value: no hardware text lockdown here. ctables/verify fixtures in the reference check the
# missing/wrong-width/unprotected/protected cases; the missing case is this board until now.
kernel-ctrr-to-be-enabled = 0
# `embedded-panic-log-size` deliberately absent: panic_region writes it, and
# SecureDTGetProperty returns the FIRST property of a name, so a copy here wins
# over the one that matches pram.reg -- which is how 0x380000 (the old
# 0xFF800000/llcc_lpi size) came to describe a 0x200000 region and made
# check_for_panic_log() bail out. devicetree.py now refuses the combination.
# SecureBootModel=Disabled, in the only form XNU reads it. AppleImage4 asks the security state whether this
# is a production device before it reads a nonce slot; on this board there is no such slot, so it reports
# "failed to read nonce slot data: 2" for every magazine and then waits. Production status 0 with security
# mode 1 is development/permissive: the same four values the community's working QEMU reference ADT sets
# for --ipad-identity, and the same ones an OpenCore config expresses as SecureBootModel=Disabled.
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
# Apple's own Mac17,2 device tree (decoded to work/analysis/ref/mac17g.adt) carries the rest of this set,
# which Image4 consults before it reads a nonce slot: the AP-side security mode, downgradability and the
# nonce-retrieval permission. uke declared four of them and no nonce at all, which is why every magazine
# reports "failed to read nonce slot data".
effective-security-mode-ap = 1
security-downgradable = 1
allow-ap-nonce-retrieval = 1
image4-allow-magazine-updates = 1
secure-boot = 0

[adt.chosen.string]
# Apple's own Mac17,2 device tree carries this in /chosen, next to the security-mode keys, and the value
# is "sha2-384". Nothing on this board provided it, and the kernel panics with
#   panic: non-sensical crypto hash method
# from Apple's nonce path (the collection's strings put it next to
# IOReturn AppleMobileApNonce::_retrieveNonce), which is also why every magazine reports that it cannot
# read a nonce slot: without the hash method the slot contents cannot be interpreted at all.
crypto-hash-method = "sha2-384"

[adt.chosen.bytes]
# The boot nonce itself. On Apple silicon iBoot writes it into /chosen and Image4 reads it back through
# the magazine path; nothing on this board produces one, so the slot read fails for every magazine.
boot-nonce = "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
boot-manifest-hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"

# /chosen/machine-timeouts: XNU's own watchdog for "preemption was disabled too long". Round b142 tripped
# it and died at
#   Preemption disable timeout exceeded: 141.579 ms >= 6.250 ms (start: 993638512, end: 996356831)
# before printing anything else worth reading. Two things make that trip uninformative here rather than
# decisive:
#   * the skip predicate (kprintf_spam_mt_pred, osfmk/arm/preemption_disable.c:459) treats "no serial
#     output" as "kprintf spam is off", so on a board with no UART the watchdog stays armed even though
#     the text console is the only way out of this kernel, and
#   * a 141 ms window is the kext-load/security-policy stall this board is already known to sit in
#     (AppleImage4 waits for a nonce slot that does not exist; see the security keys above), not a
#     separate fault: the watchdog fires inside the wait it is supposed to diagnose.
# OFF, not traced. TRACE (1) was tried first and is worse: it keeps the measurement, and the measurement
# itself is what round b144 died on. With the mode non-zero, the first 0->1 preemption disable calls
# _prepare_preemption_disable_measurement() (osfmk/arm/preemption_disable.c:325), which unconditionally
# calls ml_set_interrupts_enabled_with_debug(false) -- a call that asserts the hardware was fully
# UNmasked -- and on this board the first preemption disable happens with I and F already masked:
#   machine_routines_common.c:1128 Assertion failed: state & DAIF_STANDARD_DISABLE == 0
#   (0xc0 == 0x0, 192 == 0) at pc _ml_set_interrupts_enabled_with_debug+0x1e8,
#   lr __prepare_preemption_disable_measurement+0x44
# So both hygiene symptoms this board has produced -- the 141 ms timeout of b142 and this assertion --
# come from the same optional instrumentation. OFF (0) removes the measurement path, which is the only
# thing that reaches that assertion from here.
#
# OPEN, and worth answering rather than forgetting: XNU expects the first preemption disable to happen
# with interrupts enabled. On this board it happens with them masked, which is legal but not Apple's
# boot order -- either early init disables preemption before ml_set_interrupts_enabled(TRUE) is reached,
# or the loader hands off with DAIF masked where iBoot would not. Once that is understood, SCHED_HYGIENE
# can be turned back on (mode 2) and the timeout becomes a useful tripwire again instead of a wall.
[adt.chosen.machine-timeouts.u32]
sched-preemption-disable-mode = 0

[adt.defaults.u32]
sleep-disabled = 1
# vmm-present tells Apple's code — the binary kexts read /defaults/vmm-present, the string is in
# kernelcache.release, and pe_init.c:38 binds it as TUNABLE_DT(PE_vmm_present, "/defaults", "vmm-present")
# — that this machine runs under a hypervisor, so AMFI does not wait for an ApplePMGR service it can never
# find. That is exactly the condition scripts/unixnu/payload.py:check_native_root() exists to prevent, and
# declaring it here is the framework's own documented escape for such a board ("A board whose device tree
# declares vmm-present has no PMGR for AMFI to wait for; it needs no PMGR stand-in"). Why this board needs
# the escape now: CONFIG_XNU_NATIVE_UFS is on, and NativeUfs.cpp:2089 returns false without
# native-ufs-root=1, so storage exists only if that gate is passed — while the gate's other exit, the
# _sheng_pmgr_run symbol from SHENG_PMGR, is unbuildable on this train (its archive inherits ApplePMGR slot
# addresses audited on the iPadOS 17 kernelcache).
# What it does NOT change, checked in the source before setting it: the only PE_vmm_present consumer in XNU
# is allow_research_modes() (bsd/sys/code_signing.h:198), which is an or-chain whose other arms are the ESDM
# fuses and PE_i_can_has_debugger — and this board already boots with -v, debug=0x14e, so research modes are
# already allowed. kern.hv_vmm_present is informational. If a future round regresses in a place that branches
# on VM presence, this single line is the suspect and can be dropped together with its two kernel_args.
"vmm-present" = 1
# AppleImage4 matches on /defaults, not /chosen (see the evb10 device record), so the security state it
# consults before reading a nonce slot has to be here. Values as in the community's working QEMU reference.
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
"kern.maxvnodes" = 0x13400

[adt.product.string]
model = "xiaomi,uke"

[adt.product.u32]
thin-bezel = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# The panic log's top-level `pram` node is NOT configured here: [payload.adt] panic_region writes it
# (devicetree.py) and [adt.pram] is refused, so there is one number pair and not two.
#
# Round B26b (2026-11-04) had it here, as
#   # [adt.pram.bytes]
#   # reg = "000080ff000000000000380000000000"      # 0xFF800000, 0x380000
# and disabled it again: publishing it hung the boot before the kernel printed a single line, with the
# panel left on the loader's hand-off frame. 0xFF800000 is not DRAM to hand to an OS -- it is the
# llcc_lpi_region reservation of the UEFI memory map (MemoryMapLib.c: {"llcc_lpi_region@ff800000",
# 0xFF800000, 0x00380000, AddMem, MEM_RES, UNCACHEABLE, ...}) -- and PE_create_console() maps and
# bzeroes the region before the video console exists, so a fault or a stall there is completely silent.
# The region in use now, 0x9FFE00000, is the tail of the managed DRAM run instead. What that old attempt
# proves is that this code path can stop the boot, not that this address does: the panel line
# "PREVIOUS XNU LOG (pram=0 size=0)" is the evidence that the node was never found at all since.
#
# gmu-memory is inert until the GPU stage adopts the pool, so it goes with the ADT above to keep the
# shipped ADT byte-for-byte the one that booted.
# [adt.gmu-memory.bytes]
# reg = "000000c8000000000000000200000000"
